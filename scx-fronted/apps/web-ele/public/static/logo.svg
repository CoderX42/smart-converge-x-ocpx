  <path d="M39 116L79 80L109 50" stroke="white" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M101 39.5L124 34L119 57.5L101 39.5Z" fill="white"/>
  <circle cx="79" cy="80" r="6" fill="white"/>
  <defs>
    <linearGradient id="surface" x1="18" y1="12" x2="147" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0758E8"/>
      <stop offset="0.52" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="stream" x1="40" y1="45" x2="119" y2="115" gradientUnits="userSpaceOnUse">
