### xxl-job, email（不用邮件时可保持本机占位，不依赖环境变量）
spring.mail.host=127.0.0.1
spring.mail.port=25
spring.mail.username=no-reply@localhost
spring.mail.from=no-reply@localhost
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

### xxl-job, access token（须与 scx-boot application-*.yml 中 xxl.job.accessToken 一致）
xxl.job.accessToken=default_token

### xxl-job, request executor timeout, by second, default 3s
xxl.job.timeout=3

### xxl-job, i18n (default is zh_CN, and you can choose "zh_CN", "zh_TC" and "en")
xxl.job.i18n=zh_CN

## xxl-job, triggerpool max size
xxl.job.triggerpool.fast.max=300
xxl.job.triggerpool.slow.max=200

## xxl-job, schedule batch size
xxl.job.schedule.batchsize=100

### xxl-job, log retention days
xxl.job.logretentiondays=30

### xxl-sso
xxl-sso.token.key=xxl_sso_token_key_please_change
xxl-sso.token.timeout=604800000
xxl-sso.client.excluded.paths=
xxl-sso.client.login.path=/auth/login
