asyncapi: 3.0.0
info:
  title: SCX OCPX 内部可靠队列
  version: 1.0.0
  description: >-
    scx-rtb 内部 Redis Streams 与配置失效通知的逻辑契约。MySQL 是最终事实源和投递任务源；
    这些内部地址不是第三方接入 API。
channels:
  feedbackPartition:
    address: 'scx:ocpx:{feedback:{partition}}:stream'
    parameters:
      partition:
        description: 0 到 partition-count-1，默认 64 个分区
    messages:
      feedbackEnvelope:
        $ref: '#/components/messages/FeedbackEnvelope'
  feedbackDlqPartition:
    address: 'scx:ocpx:{feedback:{partition}}:dlq'
    parameters:
      partition:
        description: 与原 feedback 分区一致
    messages:
      feedbackEnvelope:
        $ref: '#/components/messages/FeedbackEnvelope'
  configChanged:
    address: scx:ocpx:config:changed
    messages:
      routeConfigChanged:
        $ref: '#/components/messages/RouteConfigChanged'
operations:
  persistFeedback:
    action: receive
    channel: { $ref: '#/channels/feedbackPartition' }
    messages:
      - $ref: '#/channels/feedbackPartition/messages/feedbackEnvelope'
  observeConfigChange:
    action: receive
    channel: { $ref: '#/channels/configChanged' }
    messages:
      - $ref: '#/channels/configChanged/messages/routeConfigChanged'
components:
  messages:
    FeedbackEnvelope:
      payload:
        type: object
        required: [eventId, payloadHash, eventType, channelCode, routeId, routeVersion, encryptedFeedback, encryptedRoute]
        properties:
          eventId: { type: string }
          payloadHash: { type: string, pattern: '^[a-f0-9]{64}$' }
          eventType: { type: string }
          channelCode: { type: string }
          routeId: { type: string }
          routeVersion: { type: integer, minimum: 1 }
          encryptedFeedback: { type: string }
          encryptedRoute: { type: string }
    RouteConfigChanged:
      payload:
        type: string
        description: aggregateId:configVersion:eventType；订阅方按 aggregateId 失效本地快照
