openapi: 3.1.0
info:
  title: SCX Event Ingestion API
  version: 0.1.0-draft
  description: 展示、点击与转化事件接入草案。
servers:
  - url: https://events.example.invalid/events/v1
paths:
  /events:
    post:
      operationId: acceptEvent
      security: [{hmacAuth: []}]
      parameters:
        - {name: X-App-Id, in: header, required: true, schema: {type: string}}
        - {name: X-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-Nonce, in: header, required: true, schema: {type: string}}
        - {name: X-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IngestEvent'}
      responses:
        '202':
          description: 已可靠接收，尚未承诺有效、归因或计费
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        '400': {description: 格式错误}
        '401': {description: 签名错误或重放}
        '429': {description: 限流}
  /receipts/{receiptId}:
    get:
      operationId: getReceipt
      security: [{hmacAuth: []}]
      parameters:
        - name: receiptId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 当前处理状态；调用方只能访问自身作用域事件
components:
  securitySchemes:
    hmacAuth:
      type: apiKey
      in: header
      name: X-Signature
  schemas:
    IngestEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, eventType, occurredAt, trackingToken]
      properties:
        schemaVersion: {type: string, const: '1.0'}
        eventId: {type: string, maxLength: 128}
        eventType: {type: string, enum: [IMPRESSION, CLICK, CONVERSION]}
        occurredAt: {type: string, format: date-time}
        impressionId: {type: string, maxLength: 128}
        clickId: {type: string, maxLength: 128}
        conversionId: {type: string, maxLength: 128}
        conversionType: {type: string, maxLength: 64}
        trackingToken: {type: string, maxLength: 4096}
        conversionValue: {type: integer, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        properties: {type: object, maxProperties: 32}
    Receipt:
      type: object
      required: [requestId, receiptId, status]
      properties:
        requestId: {type: string}
        receiptId: {type: string}
        status: {type: string, const: RECEIVED}

