openapi: 3.1.0
info:
  title: SCX OCPX data plane and management contracts
  version: 13.0.0
  description: SCX OCPX Feedback/Callback data plane, provider-neutral RTA decision and admission gate (MOCK and WEIFENG_RTA), V119 complete flow trace, V120 GRAVITY, V124 RENREN_VIDEO, V127 PHOENIX CPA, retained callback key-ring compatibility, and V122 retirement of V121 full wire audit. Partner data-plane requests use HTTP GET Query String parameters unless explicitly documented otherwise.
servers:
  - url: https://{domain}/ocpx
    variables:
      domain:
        default: sandbox.example.invalid
  - url: http://localhost:10000/ocpx
paths:
  /monitor-tasks/{taskId}/rta-test:
    servers:
      - url: http://localhost:9999/boot/ocpx
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, maxLength: 32 } }
    get:
      operationId: previewMonitorTaskRtaTest
      summary: 查询单任务 OPPO 至微风 RTA 测试配置与阻塞原因
      description: 仅真实系统管理员且具备 ocpx:monitor-task:test；目标与策略由服务端读取，秘密不返回浏览器。
      security: [{ saToken: [] }]
      responses:
        '200': { description: 固定地址、任务策略、非秘密计划参数、随机测试ID及阻塞原因 }
        '403': { description: 无测试权限或非真实系统管理员 }
    post:
      operationId: executeMonitorTaskRtaTest
      summary: 服务端签名并通过正式 OPPO HTTP 入口执行一次真实 RTA 询量
      description: 不发送点击或转化；计入 RTA 统计。同一测试ID不自动重发，结果不明时只查询状态。需在Boot配置与Engine一致的媒体签名密钥。
      security: [{ saToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, oaid]
              properties:
                requestId: { type: string, pattern: '^SCX-RTA-[a-f0-9]{32}$' }
                oaid: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { description: 安全白名单结果，包括同步响应是否确认及可用的Redis决策状态；执行失败可能通过业务错误码返回 }
        '403': { description: 无测试权限或非真实系统管理员 }
  /monitor-tasks/{taskId}/rta-test/{requestId}:
    servers:
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: getMonitorTaskRtaTestResult
      summary: 查询已有 RTA 测试结果，不重发询量
      security: [{ saToken: [] }]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, maxLength: 32 } }
        - { name: requestId, in: path, required: true, schema: { type: string, pattern: '^SCX-RTA-[a-f0-9]{32}$' } }
      responses:
        '200': { description: 24小时内的测试结果与已关联的脱敏RTA状态，不含设备原文或凭据 }
        '403': { description: 无测试权限或非真实系统管理员 }
  /rta/oppo/{code}:
    post:
      summary: OPPO 同步 RTA 决策（媒体专属接入码，JSON MD5 验签）
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './oppo-rta-request.schema.json'}
      responses:
        '200':
          description: 同步策略结果；仅 agree_type_list 中的策略允许投放
          content:
            application/json:
              schema: {$ref: './oppo-rta-response.schema.json'}
        '400': {description: 参数或协议无效}
        '401': {description: 签名、时间或账户不匹配}
        '403': {description: 媒体不可用}
        '409': {description: 请求 ID 内容冲突}
        '503': {description: 过载或系统不可用，不允许投放}
  /oppo/click/{code}/{strategy}:
    get:
      summary: OPPO 点击监测，校验策略及关联 RTA 后转发微风
      parameters:
      - {name: code, in: path, required: true, schema: {type: string}}
      - {name: strategy, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 2147483647}}
      - {name: request_id, in: query, required: true, schema: {type: string, maxLength: 128}}
      - {name: rta_request_id, in: query, schema: {type: string, maxLength: 128}, description: '缺省按 request_id 关联，须由 OPPO 确认相同 ID 语义'}
      - {name: oaid, in: query, required: true, schema: {type: string, maxLength: 256}}
      - {name: ad_id, in: query, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,18}$'}}
      - {name: ts, in: query, required: true, schema: {type: string, pattern: '^[0-9]{13}$'}}
      - {name: model, in: query, required: true, schema: {type: string, maxLength: 128}}
      - {name: ip, in: query, schema: {type: string}}
      - {name: ua, in: query, schema: {type: string}}
      - {name: osv, in: query, schema: {type: string}}
      responses:
        '200': {description: 点击处理成功；不表示微风已经入库}
        '400': {description: 参数无效或宏未替换}
        '403': {description: 无可用决策、设备不符或策略不匹配}
        '503': {description: 处理失败}
  /rta/options/{kind}:
    get:
      summary: RTA 独立远程下拉选项，最多100条；支持 keyword/advertiserId/mediaId。
      security:
      - saToken: []
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - advertisers
          - media
          - tasks
          - upstreams
      - name: advertiserId
        in: query
        schema:
          type: string
      - name: mediaId
        in: query
        schema:
          type: string
      - name: monitorTaskId
        in: query
        schema:
          type: string
      - name: keyword
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Result<Array<{id,name}>>，按当前广告主数据范围过滤
  /rta/requests:
    post:
      summary: 媒体异步请求
      description: 合作方 HMAC-SHA256 覆盖 POST、完整路径、凭据引用、毫秒时间戳、随机 nonce 和原始请求体 SHA256，以换行连接。时间窗口正负
        5 分钟，同一 nonce 10 分钟内不得重用。媒体身份从凭据解析。202 不代表放行。详见 rta-async.md。
      security: []
      parameters:
      - &rtaHeader001
        name: X-Rta-Key
        in: header
        required: true
        schema:
          type: string
      - &rtaHeader002
        name: X-Rta-Timestamp
        in: header
        required: true
        schema:
          type: string
      - &rtaHeader003
        name: X-Rta-Nonce
        in: header
        required: true
        schema:
          type: string
      - &rtaHeader004
        name: X-Rta-Sign
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RtaAsyncRequest'
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RtaAsyncAccepted'
        '400':
          description: 协议校验失败
        '401':
          description: 认证失败或重放
        '404':
          description: 请求不存在或不属于该广告主接入
        '409':
          description: 幂等内容冲突
        '410':
          description: 决策已超时
        '413':
          description: 请求超过64KiB
        '503':
          description: 暂不可用
  /rta/callbacks/{accessCode}:
    post:
      summary: 广告主独立 HTTP 决策回调
      description: 合作方 HMAC-SHA256 覆盖 POST、完整路径、凭据引用、毫秒时间戳、随机 nonce 和原始请求体 SHA256，以换行连接。时间窗口正负
        5 分钟，同一 nonce 10 分钟内不得重用。媒体身份从凭据解析。202 不代表放行。详见 rta-async.md。
      security: []
      parameters:
      - *rtaHeader001
      - *rtaHeader002
      - *rtaHeader003
      - *rtaHeader004
      - name: accessCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RtaAsyncDecision'
      responses:
        '200':
          description: 已确认
        '400':
          description: 协议校验失败
        '401':
          description: 认证失败或重放
        '404':
          description: 请求不存在或不属于该广告主接入
        '409':
          description: 幂等内容冲突
        '410':
          description: 决策已超时
        '413':
          description: 请求超过64KiB
        '503':
          description: 暂不可用
  /rta/protocols:
    get:
      tags: [RTA]
      summary: 已安装 RTA 协议与配置字段（广告主接入和任务绑定权限）
      security: [{saToken: []}]
      responses:
        '200':
          description: Result 包装的协议定义数组；包括 code/name/mode/maxCandidates/retrySafe/credentialRequired/fixedEndpoint/configFields/bindingFields，不含密钥。
