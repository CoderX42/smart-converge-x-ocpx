openapi: 3.1.0
info:
  title: SCX OCPX four-entity data plane
  version: 2.0.0
  description: Downstream media feedback, upstream advertiser callback and public tracking routes.
servers:
  - url: https://{domain}/ocpx
    variables: { domain: { default: sandbox.example.invalid } }
  - url: http://localhost:10000/ocpx
paths:
  /open-api/ocpx/v2/media/{mediaCode}/feedback:
    post:
      operationId: acceptMediaFeedbackV2
      parameters:
        - { name: mediaCode, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - { $ref: '#/components/parameters/Authorization' }
        - { $ref: '#/components/parameters/KeyVersion' }
        - { $ref: '#/components/parameters/Timestamp' }
        - { $ref: '#/components/parameters/Nonce' }
        - { $ref: '#/components/parameters/Signature' }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: './feedback-req-v2.schema.json' } }
      responses:
        '202': { description: Synchronously forwarded to the advertiser and logged }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /open-api/ocpx/v2/advertisers/{advertiserCode}/callback:
    get:
      operationId: acceptAdvertiserCallbackV2
      parameters:
        - { name: advertiserCode, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - { name: ext, in: query, required: true, schema: { type: string, maxLength: 1024 } }
        - { name: event, in: query, required: false, schema: { type: string } }
        - { name: action_type, in: query, required: false, schema: { type: string } }
        - { name: event_id, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: conversion_id, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: order_id, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: currency_amount, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Adapter-defined response }
        '404': { description: Advertiser or adapter not found }
        '502': { description: Downstream media rejected the callback or was unavailable }
  /c/{taskCode}:
    get:
      operationId: openTrackingRoute
      parameters:
        - { name: taskCode, in: path, required: true, schema: { type: string, minLength: 2, maxLength: 64 } }
      responses:
        '302': { description: Redirect to the active promotion URL }
        '410': { description: Active monitor task is unavailable }
webhooks:
  downstreamCallback:
    post:
      operationId: deliverDownstreamCallbackV2
      parameters:
        - { name: Authorization, in: header, required: false, description: TOKEN media receives Bearer authentication, schema: { type: string } }
        - { $ref: '#/components/parameters/KeyVersion' }
        - { $ref: '#/components/parameters/Timestamp' }
        - { $ref: '#/components/parameters/Nonce' }
        - { $ref: '#/components/parameters/Signature' }
        - { name: Idempotency-Key, in: header, required: true, description: Stable event id for media-side deduplication, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: './callback-req-v2.schema.json' } }
      responses:
        '200': { description: Any 2xx is accepted }
components:
  parameters:
    Authorization: { name: Authorization, in: header, required: false, description: TOKEN media uses Bearer authentication, schema: { type: string } }
    KeyVersion: { name: X-OCPX-Key-Version, in: header, required: false, description: Required for SIGNATURE media, schema: { type: integer, minimum: 1 } }
    Timestamp: { name: X-OCPX-Timestamp, in: header, required: false, description: Required for SIGNATURE media; seconds or milliseconds since epoch, schema: { type: integer } }
    Nonce: { name: X-OCPX-Nonce, in: header, required: false, description: Required for SIGNATURE media and included in the HMAC input, schema: { type: string, minLength: 16, maxLength: 128 } }
    Signature: { name: X-OCPX-Signature, in: header, required: false, description: HMAC-SHA256 of method, path, timestamp, nonce and body hash, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
  responses:
    Error:
      description: Protocol error
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties: { code: { type: integer }, message: { type: string } }
