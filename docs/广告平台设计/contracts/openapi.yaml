openapi: 3.1.0
info:
  title: SCX OCPX Feedback/Callback GET data plane
  version: 5.0.0
  description: SCX OCPX Feedback and Callback data plane. All partner requests use HTTP GET Query String parameters.
servers:
  - url: https://{domain}/ocpx
    variables:
      domain:
        default: sandbox.example.invalid
  - url: http://localhost:10000/ocpx
paths:
  /feedback:
    get:
      operationId: ingestFeedback
      parameters:
        - { name: mId, in: query, required: true, description: OcpxMedia.id, schema: { type: string, maxLength: 32 } }
        - { name: tId, in: query, required: true, description: OcpxMonitorTask.id, schema: { type: string, maxLength: 32 } }
        - { name: aId, in: query, required: true, description: OcpxAdvertiser.id；不同于广告主侧广告 ID adv_id, schema: { type: string, maxLength: 32 } }
        - { name: lId, in: query, required: true, description: OcpxPromotionLink.id, schema: { type: string, maxLength: 32 } }
        - { name: event, in: query, required: true, schema: { type: string, enum: [IMP, CLK] } }
        - { name: request_id, in: query, required: false, description: Missing value falls back to request JSON MD5, schema: { type: string, maxLength: 128 } }
        - { name: callback_url, in: query, required: false, schema: { type: string, maxLength: 2000 } }
        - { name: caid, in: query, required: false, schema: { type: string } }
        - { name: caid_list, in: query, required: false, schema: { type: string } }
        - { name: caid1, in: query, required: false, schema: { type: string } }
        - { name: last_caid, in: query, required: false, schema: { type: string } }
        - { name: prev_caid, in: query, required: false, schema: { type: string } }
        - { name: idfa, in: query, required: false, schema: { type: string } }
        - { name: idfa_md5, in: query, required: false, schema: { type: string } }
        - { name: aaid, in: query, required: false, schema: { type: string } }
        - { name: imei, in: query, required: false, schema: { type: string } }
        - { name: imei_md5, in: query, required: false, schema: { type: string } }
        - { name: oaid, in: query, required: false, schema: { type: string } }
        - { name: oaid_md5, in: query, required: false, schema: { type: string } }
        - { name: androidid, in: query, required: false, schema: { type: string } }
        - { name: androidid_md5, in: query, required: false, schema: { type: string } }
        - { name: mac, in: query, required: false, schema: { type: string } }
        - { name: mac_md5, in: query, required: false, schema: { type: string } }
        - { name: ip, in: query, required: false, schema: { type: string } }
        - { name: model, in: query, required: false, schema: { type: string } }
        - { name: os, in: query, required: false, description: 0 Android, 1 iOS, schema: { type: string, enum: ['0', '1'] } }
        - { name: ts, in: query, required: false, schema: { type: string } }
        - { name: mts, in: query, required: false, schema: { type: string } }
        - { name: ua, in: query, required: false, schema: { type: string } }
        - { name: adv_id, in: query, required: false, schema: { type: string } }
        - { name: group_id, in: query, required: false, schema: { type: string } }
        - { name: plan_id, in: query, required: false, schema: { type: string } }
        - { name: creative_id, in: query, required: false, schema: { type: string } }
        - { name: impresss_id, in: query, required: false, schema: { type: string } }
      responses:
        '400': { description: 缺少短路由主键，或请求仍包含已退役的 chid/mid/dspid/linkid }
        '200':
          description: Legacy success response. Internal handling errors are logged and retain legacy response behavior.
          content:
            application/json:
              schema:
                type: object
                required: [ret, code, msg, data]
                properties:
                  ret: { type: integer, const: 0 }
                  code: { type: integer, const: 200 }
                  msg: { type: string, const: 提交成功 }
                  data: { type: object }
  /callback:
    get:
      operationId: handleUpstreamCallback
      parameters:
        - { name: ext, in: query, required: true, description: URL-safe Base64 AES encrypted Feedback, schema: { type: string } }
        - { name: s, in: query, required: false, description: lId_tId state, schema: { type: string } }
        - { name: event_type, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 19 } }
        - { name: event_time, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Empty response after Callback handling }
        '500': { description: Callback parse or handling exception }
  /aerim/callback:
    get:
      operationId: handleAerimCallback
      description: AERIM string actions are normalized to SCX action numbers. The receive time is used as action_time.
      parameters:
        - { name: ext, in: query, required: true, description: URL-safe Base64 AES encrypted Feedback, schema: { type: string } }
        - { name: s, in: query, required: true, description: lId_tId state, schema: { type: string } }
        - name: action_type
          in: query
          required: true
          schema:
            type: string
            enum: [activate, reactivation, register, purchase, new, day1retention, completeorder, firstreactivation, firstorder]
        - { name: currency_amount, in: query, required: false, description: Optional purchase amount in the partner's original decimal unit, schema: { type: number, minimum: 0 } }
      responses:
        '200': { description: Empty response for success, duplicate, or deducted conversion }
        '400': { description: Missing or unknown action, invalid amount, or invalid encrypted route context }
        '500': { description: Internal handling exception }
webhooks:
  downstreamConversionGet:
    get:
      operationId: deliverDownstreamConversion
      description: SCX decodes the Feedback callback_url and appends event_type plus optional currency_amount.
      parameters:
        - { name: event_type, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 19 } }
        - { name: currency_amount, in: query, required: false, schema: { type: number, minimum: 0 } }
      responses:
        '200': { description: Response body is ignored }
