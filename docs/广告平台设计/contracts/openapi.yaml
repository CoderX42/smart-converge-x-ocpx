openapi: 3.1.0
info:
  title: SCX 通用渠道 OCPX API
  version: 1.1.0
  description: >-
    第三方渠道沙箱接入契约。source 由 X-Client-Id 对应的渠道配置推导，调用方不得提交。
    签名原文为 METHOD + 换行 + PATH + 换行 + X-Timestamp + 换行 + X-Nonce + 换行 +
    sha256(canonical JSON)，最终使用渠道密钥计算小写十六进制 HMAC-SHA256。
    当前代码与本契约不代表已经通过 20,000 QPS 或真实渠道生产验收。
servers:
  - url: http://localhost:9999/boot
    description: Local sandbox
paths:
  /open-api/events/v1/clicks:
    post:
      operationId: ingestFeedbackClick
      summary: 接收渠道 Feedback 点击
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/KeyVersion'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: './event-envelope.schema.json'
                - type: object
                  properties:
                    eventType: { const: CLICK }
      responses:
        '202': { $ref: '#/components/responses/IngestionResult' }
        '200': { $ref: '#/components/responses/DuplicateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /open-api/events/v1/conversions:
    post:
      operationId: ingestAdvertiserConversion
      summary: 接收广告主转化 Callback
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/KeyVersion'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: './event-envelope.schema.json'
                - type: object
                  required: [businessEventKey]
                  properties:
                    eventType:
                      enum: [ACTIVATE, REGISTER, PAY, ORDER, NEXT_DAY_RETURN, RETAIN_3D, RETAIN_7D, FIRST_ACTIVATE, FIRST_ORDER, REACTIVATE, CUSTOM, CREDIT]
      responses:
        '202': { $ref: '#/components/responses/IngestionResult' }
        '200': { $ref: '#/components/responses/DuplicateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /open-api/events/v1/receipts/{receiptId}:
    get:
      operationId: getEventReceipt
      summary: 查询已持久化事件回执
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/KeyVersion'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 回执存在且属于当前渠道
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 回执不存在或不属于当前渠道
  /open-api/rta/v1/decisions:
    post:
      operationId: decideRta
      summary: 同步 RTA 决策
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/KeyVersion'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schemaVersion, requestId, taskCode, device]
              properties:
                schemaVersion: { const: '1.1' }
                requestId: { type: string, maxLength: 128 }
                taskCode: { type: string, maxLength: 64 }
                device: { $ref: './event-envelope.schema.json#/properties/device' }
                attributes: { type: object, additionalProperties: true }
      responses:
        '200':
          description: ALLOW 或快速失败的 DENY 决策
        '403': { $ref: '#/components/responses/Forbidden' }
  /ad/channel-clients:
    get:
      operationId: pageChannelClients
      summary: 分页查询媒体范围内的渠道凭据元数据
      description: 需要 ad:channel-client:read；响应永不包含密文、IV 或明文密钥。
      parameters:
        - { name: mediaId, in: query, required: true, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, DISABLED] } }
      responses:
        '200': { description: 管理端统一 Result 分页响应 }
    post:
      operationId: createChannelClient
      summary: 创建渠道客户端并一次性展示 v1 密钥
      description: 需要 ad:channel-client:write；secret 仅本响应展示一次。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelClientCreate' }
      responses:
        '200':
          description: 一次性凭据响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelCredentialIssue' }
  /ad/channel-clients/{id}:
    put:
      operationId: updateChannelClient
      summary: 更新端点权限、配额、动态回调、精确域名白名单或状态
      description: 需要 ad:channel-client:write；sourceCode 和 clientId 不可修改。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelClientUpdate' }
      responses:
        '200': { description: 更新结果 }
  /ad/channel-clients/{id}/credentials:
    get:
      operationId: listChannelCredentialMetadata
      summary: 查询密钥版本及有效期元数据
      description: 需要 ad:channel-client:read；无密文、IV 或明文。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: mediaId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 密钥版本元数据列表 }
  /ad/channel-clients/{id}/credentials/rotate:
    post:
      operationId: rotateChannelCredential
      summary: 轮换密钥并保留旧版本 24 小时
      description: 需要 ad:channel-client:rotate；新 secret 仅本响应展示一次。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: mediaId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 一次性新凭据响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelCredentialIssue' }
  /ad/channel-clients/{id}/credentials/{keyVersion}/revoke:
    post:
      operationId: revokeChannelCredential
      summary: 吊销非当前密钥版本
      description: 需要 ad:channel-client:rotate；当前版本必须先轮换再吊销。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: keyVersion, in: path, required: true, schema: { type: string } }
        - { name: mediaId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 吊销结果 }
  /ad/reports/details/{rawEventId}/click-sensitive:
    get:
      operationId: getMaskedClickSensitiveDetail
      summary: 查询受控的点击排查摘要
      description: >-
        需要 ad:event-sensitive:read 和对应媒体/任务读取范围。点击、计划和创意标识仅返回掩码；
        设备标识与 IP 只返回存在标记，不返回原值或完整哈希。
      parameters:
        - { name: rawEventId, in: path, required: true, schema: { type: string } }
        - { name: mediaId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 受控排查摘要
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: { type: integer, const: 0 }
                  msg: { type: [string, 'null'] }
                  data: { $ref: '#/components/schemas/ClickSensitiveDetail' }
        '403': { description: 无敏感字段权限 }
        '404': { description: 事件不存在或不在当前对象范围内 }
components:
  parameters:
    ClientId:
      in: header
      name: X-Client-Id
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    KeyVersion:
      in: header
      name: X-Key-Version
      required: true
      schema: { type: string, minLength: 1, maxLength: 32 }
    Timestamp:
      in: header
      name: X-Timestamp
      required: true
      schema: { type: string, pattern: '^[0-9]{13}$' }
      description: Unix epoch milliseconds; accepted clock skew is 180 seconds.
    Nonce:
      in: header
      name: X-Nonce
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    Signature:
      in: header
      name: X-Sign
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
  schemas:
    ClickSensitiveDetail:
      type: object
      additionalProperties: false
      required:
        - rawEventId
        - oaidProtected
        - oaidMd5Protected
        - ipProtected
        - attributeKeys
      properties:
        rawEventId: { type: string }
        clickIdMasked: { type: [string, 'null'], pattern: '^.{1,6}\*{3}$' }
        deviceModel: { type: [string, 'null'] }
        campaignIdMasked: { type: [string, 'null'], pattern: '^.{1,6}\*{3}$' }
        creativeIdMasked: { type: [string, 'null'], pattern: '^.{1,6}\*{3}$' }
        oaidProtected: { type: boolean }
        oaidMd5Protected: { type: boolean }
        ipProtected: { type: boolean }
        attributeKeys:
          type: array
          maxItems: 50
          items: { type: string }
    ChannelClientCreate:
      type: object
      additionalProperties: false
      required: [mediaId, sourceCode, allowedScopes]
      properties:
        mediaId: { type: string }
        sourceCode: { type: string, maxLength: 64 }
        allowedScopes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [CLICK, CONVERSION, RTA] }
        maxQps: { type: integer, minimum: 1, maximum: 20000, default: 2000 }
        dynamicCallbackEnabled: { type: boolean, default: false }
        callbackAllowedHosts:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 255, description: 精确公网 DNS 域名，不接受通配符或 IP }
    ChannelClientUpdate:
      type: object
      additionalProperties: false
      required: [mediaId, allowedScopes, maxQps, dynamicCallbackEnabled, callbackAllowedHosts, status]
      properties:
        mediaId: { type: string }
        allowedScopes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [CLICK, CONVERSION, RTA] }
        maxQps: { type: integer, minimum: 1, maximum: 20000 }
        dynamicCallbackEnabled: { type: boolean }
        callbackAllowedHosts:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 255, description: 精确公网 DNS 域名，不接受通配符或 IP }
        status: { type: string, enum: [ACTIVE, DISABLED] }
    ChannelCredentialIssue:
      type: object
      description: 管理端 Result.data；secret 只展示一次。
      required: [channelClientId, clientId, keyVersion, secret, issuedAt]
      properties:
        channelClientId: { type: string }
        clientId: { type: string }
        keyVersion: { type: string }
        secret: { type: string, writeOnly: true }
        issuedAt: { type: string, format: date-time }
        previousKeyValidUntil: { type: [string, 'null'], format: date-time }
    IngestionData:
      type: object
      required: [receiptId, eventId, duplicateDelivery, acceptanceStatus, receivedAt]
      properties:
        receiptId: { type: string, format: uuid }
        eventId: { type: string }
        duplicateDelivery: { type: boolean }
        acceptanceStatus: { type: string, enum: [BUFFERED, ACCEPTED] }
        receivedAt: { type: string, format: date-time }
  responses:
    IngestionResult:
      description: 新事件已可靠受理；点击已写入配置的 Feedback Buffer，转化已提交 MySQL 原始事实和 Outbox。
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: { type: integer, const: 0 }
              msg: { type: [string, 'null'] }
              data: { $ref: '#/components/schemas/IngestionData' }
    DuplicateResult:
      description: 相同 eventId 与相同载荷的幂等重投。
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: integer, const: 0 }
              data: { $ref: '#/components/schemas/IngestionData' }
    BadRequest: { description: 字段、设备类型或 schemaVersion 无效 }
    Unauthorized: { description: 凭据、签名、时间戳或 nonce 无效 }
    Forbidden: { description: 渠道凭据未获准调用该类端点 }
    Conflict: { description: 相同 eventId 使用了不同载荷 }
    RateLimited: { description: 当前渠道与接口超过配置配额 }
    Unavailable: { description: 必需的认证、缓存或数据库存储不可用；调用方必须重试 }
