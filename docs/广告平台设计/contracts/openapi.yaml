openapi: 3.1.0
info:
  title: SCX OCPX 双向转发 API
  version: 1.0.0
  description: >-
    scx-rtb 当前有效的数据面契约。feedback 由下游渠道发送给 SCX，Coco callback
    由上游发送给 SCX；下游 CallbackReqV1 是 SCX 主动投递协议，不是本文件中的接收接口。
    RTA、实时扣费和历史 /open-api/events/v1 接口不属于当前运行契约。
servers:
  - url: http://localhost:10000/rtb
    description: 本地联调（生产必须 HTTPS）
paths:
  /open-api/ocpx/v1/channels/{channelCode}/feedback:
    post:
      operationId: acceptChannelFeedback
      summary: 接收下游 FeedbackReqV1
      description: >-
        签名原文为 METHOD、原始 PATH、X-Timestamp、X-Nonce、sha256(原始请求体)，
        各行以换行符连接，再以渠道密钥计算小写十六进制 HMAC-SHA256。
        202 只表示 Redis Stream 已可靠接收，不表示上游投递成功。
      parameters:
        - name: channelCode
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/KeyVersion'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './feedback-req-v1.schema.json'
      responses:
        '202':
          description: 新事件已可靠进入接入队列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngressResult' }
        '200':
          description: 相同事件 ID 与相同载荷的幂等重复请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngressResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: nonce 重放，或相同事件 ID 对应不同载荷
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IngressResult'
                  - $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /open-api/ocpx/v1/upstreams/coco/callback:
    get:
      operationId: acceptCocoCallback
      summary: 接收 Coco 上游 callback
      parameters:
        - name: ext
          in: query
          required: true
          description: SCX 生成的不可猜测、有签名且有有效期的关联引用
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: action_type
          in: query
          required: true
          schema:
            type: string
            enum: [activate, register, day1retention, retention, purchase, payment, reactivation, new, firstreactivation, completeorder]
        - name: currency_amount
          in: query
          required: false
          description: 保留原始值；Coco 金额单位确认前不参与计费
          schema: { type: string, maxLength: 64 }
        - name: s
          in: query
          required: false
          description: 仅用于诊断，不参与身份或路由信任判断
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: 新回调已先持久化，或相同回调已幂等处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CocoResult'
        '400': { $ref: '#/components/responses/CocoError' }
        '401': { $ref: '#/components/responses/CocoError' }
        '410': { $ref: '#/components/responses/CocoError' }
components:
  parameters:
    ClientId:
      name: X-Client-Id
      in: header
      required: true
      schema: { type: string }
    KeyVersion:
      name: X-Key-Version
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Unix 秒或毫秒时间戳，允许窗口默认为 5 分钟
      schema: { type: integer }
    Nonce:
      name: X-Nonce
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    Signature:
      name: X-Sign
      in: header
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
  schemas:
    IngressResult:
      type: object
      required: [eventId, status, receivedAt]
      properties:
        eventId: { type: string }
        status: { type: string, enum: [ACCEPTED, DUPLICATE, CONFLICT] }
        receivedAt: { type: string, format: date-time }
    CocoResult:
      type: object
      required: [code]
      properties:
        code: { const: 0 }
        event_id: { type: string }
        status: { type: string, enum: [ACCEPTED, DUPLICATE] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
    CocoError:
      type: object
      required: [code, message]
      properties:
        code: { const: 1 }
        message: { type: string }
  responses:
    Error:
      description: 请求无效、未授权、限流或依赖服务不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CocoError:
      description: Coco 回调参数、关联引用或签名无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CocoError' }
