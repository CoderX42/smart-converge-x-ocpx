        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
    get:
      operationId: listCreativePromotionLinks
