openapi: 3.1.0
info:
  title: SCX OCPX data plane and management contracts
  version: 10.1.0
  description: SCX OCPX Feedback/Callback data plane, V111 advertiser billing, V112 monitor click testing, V113 media callback deduction, V115 database-driven upstream protocol configuration, and V116 flow-log request detail contracts. Partner data-plane requests use HTTP GET Query String parameters unless explicitly documented otherwise.
servers:
  - url: https://{domain}/ocpx
    variables:
      domain:
        default: sandbox.example.invalid
  - url: http://localhost:10000/ocpx
paths:
  /feedback:
    get:
      operationId: ingestFeedback
      parameters:
        - { name: mId, in: query, required: true, description: OcpxMedia.id, schema: { type: string, maxLength: 32 } }
        - { name: tId, in: query, required: true, description: OcpxMonitorTask.id, schema: { type: string, maxLength: 32 } }
        - { name: aId, in: query, required: true, description: OcpxAdvertiser.id；不同于广告主侧广告 ID adv_id, schema: { type: string, maxLength: 32 } }
        - { name: lId, in: query, required: true, description: OcpxPromotionLink.id, schema: { type: string, maxLength: 32 } }
        - { name: event, in: query, required: true, schema: { type: string, enum: [IMP, CLK] } }
        - { name: request_id, in: query, required: false, description: Missing value falls back to request JSON MD5, schema: { type: string, maxLength: 128 } }
        - { name: callback_url, in: query, required: false, schema: { type: string, maxLength: 2000 } }
        - { name: caid, in: query, required: false, schema: { type: string } }
        - { name: caid_list, in: query, required: false, schema: { type: string } }
        - { name: caid1, in: query, required: false, schema: { type: string } }
        - { name: caid2, in: query, required: false, schema: { type: string } }
        - { name: last_caid, in: query, required: false, schema: { type: string } }
        - { name: prev_caid, in: query, required: false, schema: { type: string } }
        - { name: idfa, in: query, required: false, schema: { type: string } }
        - { name: idfa_md5, in: query, required: false, schema: { type: string } }
        - { name: aaid, in: query, required: false, schema: { type: string } }
        - { name: imei, in: query, required: false, schema: { type: string } }
        - { name: imei_md5, in: query, required: false, schema: { type: string } }
        - { name: oaid, in: query, required: false, schema: { type: string } }
        - { name: oaid_md5, in: query, required: false, schema: { type: string } }
        - { name: androidid, in: query, required: false, schema: { type: string } }
        - { name: androidid_md5, in: query, required: false, schema: { type: string } }
        - { name: mac, in: query, required: false, schema: { type: string } }
        - { name: mac_md5, in: query, required: false, schema: { type: string } }
        - { name: ip, in: query, required: false, schema: { type: string } }
        - { name: ipv6, in: query, required: false, schema: { type: string } }
        - { name: model, in: query, required: false, schema: { type: string } }
        - { name: osv, in: query, required: false, schema: { type: string } }
        - { name: os, in: query, required: false, description: 0 or ANDROID for Android; 1 or IOS for iOS, schema: { type: string, enum: ['0', '1', ANDROID, IOS] } }
        - { name: ts, in: query, required: false, schema: { type: string } }
        - { name: mts, in: query, required: false, schema: { type: string } }
        - { name: ua, in: query, required: false, schema: { type: string } }
        - { name: adv_id, in: query, required: false, schema: { type: string } }
        - { name: group_id, in: query, required: false, schema: { type: string } }
        - { name: plan_id, in: query, required: false, schema: { type: string } }
        - { name: creative_id, in: query, required: false, schema: { type: string } }
        - { name: impresss_id, in: query, required: false, schema: { type: string } }
        - { name: clickid, in: query, required: false, schema: { type: string } }
      responses:
        '400': { description: 缺少短路由主键，或请求仍包含已退役的 chid/mid/dspid/linkid }
        '200':
          description: MySQL fact transaction committed successfully.
          content:
            application/json:
              schema:
                type: object
                required: [ret, code, msg, data]
                properties:
                  ret: { type: integer, const: 0 }
                  code: { type: integer, const: 200 }
                  msg: { type: string, const: 提交成功 }
                  data: { type: object }
        '500': { description: MySQL event, billing, or hourly projection transaction failed }
  /callback:
    get:
      operationId: handleUpstreamCallback
      parameters:
        - { name: ext, in: query, required: true, description: URL-safe Base64 AES encrypted Feedback, schema: { type: string } }
        - { name: s, in: query, required: false, description: lId_tId state, schema: { type: string } }
        - { name: event_type, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 19 } }
        - { name: event_time, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Empty response after Callback handling }
        '500': { description: Callback parse or handling exception }
  /aerim/callback:
    get:
      operationId: handleAerimCallback
      description: AERIM string actions are normalized to SCX action numbers. The receive time is used as action_time.
      parameters:
        - { name: ext, in: query, required: true, description: URL-safe Base64 AES encrypted Feedback, schema: { type: string } }
        - { name: s, in: query, required: true, description: lId_tId state, schema: { type: string } }
        - name: action_type
          in: query
          required: true
          schema:
            type: string
            enum: [activate, reactivation, register, purchase, new, day1retention, completeorder, firstreactivation, firstorder]
        - { name: currency_amount, in: query, required: false, description: Optional purchase amount in the partner's original decimal unit, schema: { type: number, minimum: 0 } }
      responses:
        '200': { description: Empty response for success, duplicate, or deducted conversion }
        '400': { description: Missing or unknown action, invalid amount, or invalid encrypted route context }
        '500': { description: Internal handling exception }
  /weifeng/callback:
    get:
      operationId: handleWeifengCallback
      description: 微风互动 v1.3 字符串事件映射到 SCX 动作编号，action_time 使用接收时间。
      parameters:
        - { name: ext, in: query, required: true, description: URL-safe Base64 AES encrypted Feedback, schema: { type: string } }
        - { name: s, in: query, required: true, description: lId_tId state, schema: { type: string } }
        - name: event
          in: query
          required: true
          schema:
            type: string
            enum: [ACTIVATED, REGISTERED, PAID, RETAINED, FIRST_DAY_PAID, APP_OPEN]
        - name: amount
          in: query
          required: false
          description: PAID or FIRST_DAY_PAID amount; an unreplaced __AMOUNT__ macro is treated as absent.
          schema:
            oneOf:
              - { type: number, minimum: 0 }
              - { type: string, const: __AMOUNT__ }
        - name: days
          in: query
          required: false
          description: RETAINED day count; an unreplaced __DAYS__ macro is treated as absent and the value is not persisted as a separate current metric.
          schema:
            oneOf:
              - { type: integer, minimum: 0, maximum: 3650 }
              - { type: string, const: __DAYS__ }
      responses:
        '200': { description: Empty response for success, duplicate, or deducted conversion }
        '400': { description: Missing or unknown event, invalid amount/days, or invalid encrypted route context }
        '500': { description: Internal handling exception }
  /test-callback:
    get:
      operationId: collectMonitorTaskTestCallback
      summary: 接收完整测试的正式下游 Callback 最后一跳
      description: 目标地址只能由管理端按固定 Engine 地址生成；只有相同路由与事件已经形成 PASSED Callback 事实时才会幂等记录。该成功证据不代表真实媒体入库。
      parameters:
        - { name: request_id, in: query, required: true, schema: { type: string, pattern: '^SCX-UAT-[0-9]{14}-[0-9a-f]{12}$' } }
        - { name: token, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
        - { name: mId, in: query, required: true, schema: { type: string, maxLength: 32 } }
        - { name: tId, in: query, required: true, schema: { type: string, maxLength: 32 } }
        - { name: aId, in: query, required: true, schema: { type: string, maxLength: 32 } }
        - { name: lId, in: query, required: true, schema: { type: string, maxLength: 32 } }
        - { name: event_type, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 19 } }
        - { name: currency_amount, in: query, required: false, schema: { type: number, minimum: 0, multipleOf: 0.000001 } }
        - { name: delivery_signature, in: query, required: true, description: Engine 正式下游投递使用服务端密钥生成的 HMAC-SHA256；不会出现在测试 Feedback 中。, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        '204': { description: 首次或重复接收成功 }
        '400': { description: 测试身份、路由、事件或金额格式无效 }
        '409': { description: 对应正式 Callback 尚未形成 PASSED 扣量事实 }
        '500': { description: 脱敏审计写入失败 }
  /protocol-configs:
    servers:
      - url: https://{domain}/boot/ocpx
        variables:
          domain:
            default: sandbox.example.invalid
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: listUpstreamProtocolConfigs
      summary: 查询上游协议允许域名
      description: 仅管理员可读；返回 AERIM 与 WEIFENG 的当前精确域名白名单。空列表表示该协议全部拒绝。
      security:
        - saToken: []
      responses:
        '200':
          description: 当前协议允许域名配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtocolConfigListEnvelope' }
        '403': { description: 非管理员或缺少 ocpx:protocol-config:manage 权限 }
  /protocol-configs/{protocol}/allowed-hosts:
    servers:
      - url: https://{domain}/boot/ocpx
        variables:
          domain:
            default: sandbox.example.invalid
      - url: http://localhost:9999/boot/ocpx
    put:
      operationId: replaceUpstreamProtocolAllowedHosts
      summary: 全量替换上游协议允许域名
      description: 仅支持 AERIM 与 WEIFENG。服务端规范化、去重并校验精确域名；禁止 URL、端口、通配符、IP 和单标签主机。保存成功后通知 Engine 刷新索引。
      security:
        - saToken: []
      parameters:
        - name: protocol
          in: path
          required: true
          schema: { type: string, enum: [AERIM, WEIFENG] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtocolAllowedHostsUpdate' }
      responses:
        '200':
          description: 保存后的协议允许域名配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtocolConfigEnvelope' }
        '400': { description: 协议或域名格式无效 }
        '403': { description: 非管理员或缺少 ocpx:protocol-config:manage 权限 }
  /advertisers/account-role/permissions:
    servers:
      - url: https://{domain}/boot/ocpx
        variables:
          domain:
            default: sandbox.example.invalid
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: getAdvertiserSharedRolePermissions
      summary: 读取共享广告主角色权限
      description: 仅允许拥有 ocpx:advertiser:role:manage 的非广告主账号调用。
      security:
        - saToken: []
      responses:
        '200':
          description: 固定 ROLE_ADVERTISER 的当前权限、全量范围和受影响账号数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertiserRolePermissionsResult'
        '403': { description: 无管理权限，或广告主账号尝试管理共享角色 }
    put:
      operationId: replaceAdvertiserSharedRolePermissions
      summary: 全量替换共享广告主角色权限
      description: 服务端只接受 OCPX 白名单并自动补齐父级；成功后清理菜单缓存并注销全部广告主账号会话。
      security:
        - saToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvertiserRolePermissionsUpdate'
      responses:
        '200':
          description: 保存后的完整配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertiserRolePermissionsResult'
        '400': { description: 菜单不在 OCPX 白名单，或全量范围依赖不一致 }
        '403': { description: 无管理权限，或广告主账号尝试管理共享角色 }
  /advertisers/{id}/recharge:
    servers:
      - url: https://{domain}/boot/ocpx
        variables:
          domain:
            default: sandbox.example.invalid
      - url: http://localhost:9999/boot/ocpx
    post:
      operationId: rechargeAdvertiserAccount
      summary: 幂等充值广告主账户
      description: 仅真实 ROLE_ADMIN 且拥有 ocpx:advertiser:recharge 权限可调用；同一广告主和 requestId 返回同一流水。
      security:
        - saToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvertiserRechargeRequest' }
      responses:
        '200':
          description: 充值流水和账后余额
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserRechargeResultEnvelope' }
        '400': { description: requestId 或金额无效，或同 requestId 改变金额 }
        '403': { description: 广告主账号或非 ROLE_ADMIN 尝试充值 }
        '404': { description: 广告主或资金账户不存在 }
  /advertisers/{id}/deduct:
    servers:
      - url: https://{domain}/boot/ocpx
        variables:
          domain:
            default: sandbox.example.invalid
      - url: http://localhost:9999/boot/ocpx
    post:
      operationId: deductAdvertiserAccount
      summary: 幂等扣减广告主账户余额
      description: 仅真实 ROLE_ADMIN 且拥有 ocpx:advertiser:deduct 权限可调用；同一广告主和 requestId 返回同一流水，扣减后余额不得小于 0。
      security:
        - saToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvertiserDeductionRequest' }
      responses:
        '200':
          description: 人工扣减流水和账后余额
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdvertiserDeductionResultEnvelope' }
        '400': { description: requestId、金额或原因无效，同 requestId 改变金额或原因，或扣减金额超过可用余额 }
        '403': { description: 广告主账号或非 ROLE_ADMIN 尝试扣减 }
        '404': { description: 广告主或资金账户不存在 }
  /creatives:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: listCreatives
      summary: 分页查询严格授权范围内的创意
      security: [{ saToken: [] }]
      parameters:
        - { name: current, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: advertiserId, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: keyword, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: status, in: query, required: false, schema: { type: integer, enum: [0, 1] } }
        - { name: promotionLinkId, in: query, required: false, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { description: 创意分页, content: { application/json: { schema: { $ref: '#/components/schemas/CreativePageEnvelope' } } } }
        '403': { description: 无创意查看权限或广告主对象范围越权 }
    post:
      operationId: createCreative
      summary: 使用自有素材创建图片创意并设置最终绑定集合
      description: 只接受 sourceMaterialId；素材 URL、格式、尺寸和哈希由服务端重新读取并校验。
      security: [{ saToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreativeSaveRequest' }
      responses:
        '200': { description: 创意详情, content: { application/json: { schema: { $ref: '#/components/schemas/CreativeResultEnvelope' } } } }
        '400': { description: 素材、创意名称或绑定关系无效 }
        '403': { description: 无新增/绑定权限或跨广告主写入 }
  /creatives/assets:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: listOwnedCreativeAssets
      summary: 查询广告主自有图片素材凭证
      security: [{ saToken: [] }]
      parameters:
        - { name: advertiserId, in: query, required: true, schema: { type: string, maxLength: 32 } }
        - { name: keyword, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: 自有素材列表, content: { application/json: { schema: { $ref: '#/components/schemas/CreativeAssetListEnvelope' } } } }
        '403': { description: 跨广告主素材访问 }
    post:
      operationId: uploadCreativeAsset
      summary: 上传并登记广告主自有图片素材
      description: JPG/JPEG/PNG/WEBP；最大 20MB、最长边 8192px、总像素不超过 4000 万。
      security: [{ saToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [advertiserId, file]
              properties:
                advertiserId: { type: string, maxLength: 32 }
                file: { type: string, format: binary }
      responses:
        '200': { description: 已登记的素材凭证和重复创意提示, content: { application/json: { schema: { $ref: '#/components/schemas/UploadedCreativeAssetEnvelope' } } } }
        '400': { description: 文件类型、文件头、大小、尺寸或解码失败 }
        '403': { description: 跨广告主上传 }
  /creatives/{id}:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
    get:
      operationId: getCreative
      security: [{ saToken: [] }]
      responses:
        '200': { description: 创意详情, content: { application/json: { schema: { $ref: '#/components/schemas/CreativeResultEnvelope' } } } }
        '403': { description: 对象范围越权 }
        '404': { description: 创意不存在 }
    put:
      operationId: updateCreative
      summary: 修改创意并设置最终绑定集合
      security: [{ saToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreativeSaveRequest' } } }
      responses:
        '200': { description: 创意详情, content: { application/json: { schema: { $ref: '#/components/schemas/CreativeResultEnvelope' } } } }
        '400': { description: 素材、名称或绑定无效 }
        '403': { description: 跨广告主写入 }
    delete:
      operationId: deleteCreative
      summary: 逻辑删除创意并物理解除当前绑定，不删除素材
      security: [{ saToken: [] }]
      responses:
        '200': { description: 删除成功 }
        '403': { description: 跨广告主删除 }
        '404': { description: 创意不存在 }
  /creatives/{id}/promotion-links:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
    get:
      operationId: listCreativePromotionLinks
      security: [{ saToken: [] }]
      responses:
        '200': { description: 当前绑定集合, content: { application/json: { schema: { $ref: '#/components/schemas/CreativeLinkListEnvelope' } } } }
    put:
      operationId: replaceCreativePromotionLinks
      summary: 幂等替换最终绑定集合；空数组解除全部绑定
      security: [{ saToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreativeBindingsRequest' } } }
      responses:
        '200': { description: 替换后的绑定集合, content: { application/json: { schema: { $ref: '#/components/schemas/CreativeLinkListEnvelope' } } } }
        '400': { description: 推广链接不存在或不属于创意广告主 }
        '403': { description: 无绑定权限或跨广告主写入 }
  /monitor-tasks:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    post:
      operationId: createMonitorTaskWithBilling
      summary: 创建监测任务并保存计费配置
      description: 新任务默认关闭扣费；调用账号必须是内部账号并拥有 ocpx:monitor-task:billing。
      security: [{ saToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskSaveRequest' } } }
      responses:
        '200': { description: 创建成功并写入计费配置审计 }
        '400': { description: 开启扣费时单价非正数，或转化目标事件无效 }
        '403': { description: 广告主账号或无计费权限 }
  /monitor-tasks/{id}:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    put:
      operationId: updateMonitorTaskWithBilling
      summary: 编辑监测任务和计费配置
      description: 无计费权限时只能提交与当前值完全一致的计费字段；计费变化在同一事务写不可变审计快照。
      security: [{ saToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskSaveRequest' } } }
      responses:
        '200': { description: 修改成功 }
        '400': { description: 计费配置无效 }
        '403': { description: 广告主账号修改计费，或无权限账号改变计费字段 }
  /monitor-tasks/{id}/test-links:generate:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    post:
      operationId: generateMonitorTaskClickTestLink
      summary: 生成随机且可编辑的完整 CLK 测试链接预览
      description: 仅拥有 ocpx:monitor-task:test 的真实 ROLE_ADMIN 可用；callback_url 自动指向固定 Engine 的受控测试接收端，浏览器不能编辑目标地址。
      security: [{ saToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskTestGenerateRequest' } } }
      responses:
        '200': { description: 参数、配置检查、预计扣费和完整测试链接, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskTestPreviewEnvelope' } } } }
        '403': { description: 非真实系统管理员或缺少测试权限 }
        '404': { description: 监测任务不存在 }
  /monitor-tasks/{id}/test-links:execute:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    post:
      operationId: executeMonitorTaskClickTestLink
      summary: 服务端重建链接并向固定 Engine 发送一次真实完整 CLK 测试
      description: 不接受目标 URL；同一测试 ID 已产生事实时不重复请求 Engine。请求可能产生真实上游流量、点击或目标转化扣费和媒体扣量。
      security: [{ saToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskTestExecuteRequest' } } }
      responses:
        '200': { description: Engine HTTP 或稳定传输错误结果, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskTestExecutionEnvelope' } } } }
        '400': { description: OS、参数格式、宏转发、平台或余额校验失败 }
        '403': { description: 非真实系统管理员或缺少测试权限 }
        '404': { description: 监测任务不存在 }
  /monitor-tasks/{id}/test-results/{requestId}:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: getMonitorTaskClickTestResult
      summary: 查询点击、广告主 Callback、计费、扣量和最后一跳时间线
      description: 上游 HTTP 200 只代表点击接口已响应；测试接收端成功只证明 SCX 最后一跳可达，均不代表真实合作方或媒体业务入库。
      security: [{ saToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
        - { name: requestId, in: path, required: true, schema: { type: string, pattern: '^SCX-UAT-[0-9]{14}-[0-9a-f]{12}$' } }
      responses:
        '200': { description: 当前测试详情, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskTestResultEnvelope' } } } }
        '403': { description: 非真实系统管理员或缺少测试权限 }
        '404': { description: 监测任务不存在 }
  /monitor-tasks/{id}/integration/feedback-requests:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: listMonitorTaskIntegrationFeedback
      summary: 查询下游 Feedback 规范化落库快照
      description: 仅拥有 ocpx:monitor-task:integration 的真实 ROLE_ADMIN 可用；数据异步写入且不是网络层原始报文。
      security: [{ saToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
        - { name: startDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: endDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: requestId, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: current, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 下游请求明细分页, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskIntegrationFeedbackPageEnvelope' } } } }
        '400': { description: 日期范围或 requestId 无效 }
        '403': { description: 非真实系统管理员或缺少联调权限 }
        '404': { description: 监测任务不存在 }
  /monitor-tasks/{id}/integration/callbacks:send:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    post:
      operationId: sendMonitorTaskIntegrationCallback
      summary: 使用选中 Feedback 的 callback_url 发送真实媒体 Callback
      description: 不接受任意目标 URL；不生成广告主转化事实、不扣费、不执行正式媒体扣量；拒绝把完整测试的 Engine /test-callback 当作媒体地址手工发送。HTTP 2xx 不代表媒体业务入库。
      security: [{ saToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskIntegrationCallbackRequest' } } }
      responses:
        '200': { description: Callback HTTP 或稳定传输错误结果, content: { application/json: { schema: { $ref: '#/components/schemas/MonitorTaskIntegrationCallbackEnvelope' } } } }
        '400': { description: 请求未携带 callback_url、事件无效，或目标为只允许 Engine 正式签名投递的内部测试接收端 }
        '403': { description: 非真实系统管理员或缺少联调权限 }
        '404': { description: 监测任务或请求明细不存在 }
        '409': { description: 请求明细与监测任务关系不一致 }
  /flow-logs/{id}/request-detail:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: getFlowLogRequestDetail
      summary: 查询流程结果、响应预览与下游 Feedback 规范化请求参数
      description: 仅拥有 ocpx:monitor-task:integration 的真实 ROLE_ADMIN 可用；流程结果始终来自流程日志，请求数据按源 request ID 和 mId/aId/tId/lId 精确关联。响应预览经过常见凭据脱敏并限制为 4096 字符，不返回原始请求 URL、签名或凭据。响应禁止缓存。
      security: [{ saToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { description: 流程结果、响应预览与可选的下游规范化请求参数详情, headers: { Cache-Control: { schema: { type: string, const: no-store } } }, content: { application/json: { schema: { $ref: '#/components/schemas/FlowLogRequestDetailEnvelope' } } } }
        '403': { description: 非真实系统管理员或缺少联调权限 }
        '404': { description: 流程日志不存在 }
  /billing-entries:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: listBillingEntries
      summary: 查询不可变账务流水
      description: 广告主账号始终强制使用自身 advertiserId。
      security: [{ saToken: [] }]
      parameters:
        - { name: current, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: advertiserId, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: monitorTaskId, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: entryType, in: query, required: false, schema: { type: string, enum: [RECHARGE, MANUAL_DEBIT, CLICK_CHARGE, CONVERSION_CHARGE] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [POSTED, REJECTED] } }
        - { name: businessKey, in: query, required: false, schema: { type: string, maxLength: 160 } }
        - { name: startTime, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: endTime, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200': { description: 账务流水分页, content: { application/json: { schema: { $ref: '#/components/schemas/BillingEntryPageEnvelope' } } } }
        '403': { description: 无流水查看权限 }
  /dashboard/summary:
    servers:
      - url: https://{domain}/boot/ocpx
        variables:
          domain:
            default: sandbox.example.invalid
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: getTruthfulDashboardSummary
      summary: 读取真实首页指标
      security:
        - saToken: []
      parameters:
        - { name: startDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: endDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: advertiserId, in: query, required: false, schema: { type: string } }
        - { name: promotionLinkId, in: query, required: false, schema: { type: string } }
        - { name: mediaId, in: query, required: false, schema: { type: string } }
        - { name: monitorTaskId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: 服务端业务日期、账户块、数据水位和九个服务端计算指标
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummaryResultEnvelope' }
        '400': { description: 日期无效或业务对象归属关系不匹配 }
        '403': { description: 无首页权限或越权账户访问 }
  /deduction-rules:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: listMediaCallbackRatioRules
      summary: 分页读取媒体回传比例规则
      description: ratio 是 0 到 1 的媒体回传比例；未配置规则时 Engine 默认 1.0 全量放行。
      security: [{ saToken: [] }]
      parameters:
        - { name: current, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: promotionLinkId, in: query, required: false, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { description: 媒体回传比例分页, content: { application/json: { schema: { $ref: '#/components/schemas/MediaCallbackRatioRulePageEnvelope' } } } }
        '403': { description: 非管理员账号或无扣量规则查看权限 }
    post:
      operationId: createMediaCallbackRatioRule
      summary: 创建媒体回传比例规则并从零重置该路由实时计数
      security: [{ saToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MediaCallbackRatioRuleSaveRequest' } } }
      responses:
        '200': { description: 创建后的规则, content: { application/json: { schema: { $ref: '#/components/schemas/MediaCallbackRatioRuleEnvelope' } } } }
        '400': { description: ratio 超出 0 到 1 或链接媒体组合重复 }
        '403': { description: 非管理员账号或无创建权限 }
  /deduction-rules/{id}:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
    get:
      operationId: getMediaCallbackRatioRule
      security: [{ saToken: [] }]
      responses:
        '200': { description: 规则详情, content: { application/json: { schema: { $ref: '#/components/schemas/MediaCallbackRatioRuleEnvelope' } } } }
        '404': { description: 规则不存在 }
    put:
      operationId: updateMediaCallbackRatioRule
      summary: 修改媒体回传比例并从零重置对应路由实时计数
      security: [{ saToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MediaCallbackRatioRuleSaveRequest' } } }
      responses:
        '200': { description: 修改后的规则, content: { application/json: { schema: { $ref: '#/components/schemas/MediaCallbackRatioRuleEnvelope' } } } }
        '400': { description: ratio 超出 0 到 1 或链接媒体组合重复 }
        '404': { description: 规则不存在 }
    delete:
      operationId: deleteMediaCallbackRatioRule
      summary: 删除规则并将该路由恢复为 1.0 全量放行
      security: [{ saToken: [] }]
      responses:
        '200': { description: 删除成功 }
        '404': { description: 规则不存在 }
  /reports/summary:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: getAdvertiserSpendAndMediaDeductionSummary
      summary: 查询广告主消费与媒体扣量事实报表
      description: basePrice 是广告主消费；扣量数量只来自 V113 后持久化事实，不使用当前比例反推历史。
      security: [{ saToken: [] }]
      parameters:
        - { name: dateType, in: query, required: false, schema: { type: integer, enum: [0, 1, 2, 3], default: 1 } }
        - { name: startTime, in: query, required: true, schema: { type: string, pattern: '^[0-9]{8}$' } }
        - { name: endTime, in: query, required: true, schema: { type: string, pattern: '^[0-9]{8}$' } }
        - { name: mediaId, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: monitorTaskId, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: advertiserId, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: promotionLinkId, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: current, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: 广告主消费、原始 Callback、放行、拦截、待判定及覆盖状态, content: { application/json: { schema: { $ref: '#/components/schemas/DeductionSummaryPageEnvelope' } } } }
        '400': { description: 时间或业务对象归属关系无效 }
        '403': { description: 无报表查看权限 }
  /reports/summary:export:
    servers:
      - url: https://{domain}/boot/ocpx
        variables: { domain: { default: sandbox.example.invalid } }
      - url: http://localhost:9999/boot/ocpx
    get:
      operationId: exportAdvertiserSpendAndMediaDeductionSummary
      summary: 导出与页面同口径的 CSV
      description: CSV 每行重复扣量统计起始时间；PASSED 只表示已进入媒体回传提交流程，不表示媒体已接收。
      security: [{ saToken: [] }]
      parameters:
        - { name: startTime, in: query, required: true, schema: { type: string, pattern: '^[0-9]{8}$' } }
        - { name: endTime, in: query, required: true, schema: { type: string, pattern: '^[0-9]{8}$' } }
      responses:
        '200': { description: UTF-8 CSV, content: { text/csv: { schema: { type: string } } } }
        '403': { description: 无报表导出权限 }
webhooks:
  downstreamConversionGet:
    get:
      operationId: deliverDownstreamConversion
      description: SCX decodes the Feedback callback_url and appends event_type plus optional currency_amount.
      parameters:
        - { name: event_type, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 19 } }
        - { name: currency_amount, in: query, required: false, schema: { type: number, minimum: 0 } }
      responses:
        '200': { description: Response body is ignored }
components:
  securitySchemes:
    saToken:
      type: apiKey
      in: header
      name: satoken
  schemas:
    ProtocolAllowedHostsUpdate:
      type: object
      additionalProperties: false
      required: [allowedHosts]
      properties:
        allowedHosts:
          type: array
          maxItems: 50
          uniqueItems: true
          description: 精确域名列表；空列表表示禁用该协议的所有上游请求。
          items:
            type: string
            minLength: 3
            maxLength: 253
            pattern: '^(?=.{3,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$'
    ProtocolConfig:
      type: object
      required: [protocol, allowedHosts]
      properties:
        protocol: { type: string, enum: [AERIM, WEIFENG] }
        allowedHosts:
          type: array
          uniqueItems: true
          items: { type: string }
    ProtocolConfigEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        msg: { type: [string, 'null'] }
        data: { $ref: '#/components/schemas/ProtocolConfig' }
    ProtocolConfigListEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        msg: { type: [string, 'null'] }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProtocolConfig' }
    MediaCallbackRatioRuleSaveRequest:
      type: object
      additionalProperties: false
      required: [mediaId, promotionLinkId, ratio]
      properties:
        mediaId: { type: string, minLength: 1, maxLength: 32 }
        promotionLinkId: { type: string, minLength: 1, maxLength: 32 }
        ratio: { type: number, minimum: 0, maximum: 1, description: 媒体回传比例，0 全拦截，1 全放行 }
    MediaCallbackRatioRule:
      type: object
      required: [id, mediaId, promotionLinkId, ratio, createTime, updateTime]
      properties:
        id: { type: string }
        mediaId: { type: string }
        mediaName: { type: [string, 'null'] }
        promotionLinkId: { type: string }
        promotionLinkName: { type: [string, 'null'] }
        ratio: { type: number, minimum: 0, maximum: 1 }
        createTime: { type: string, format: date-time }
        updateTime: { type: string, format: date-time }
    MediaCallbackRatioRuleEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: '#/components/schemas/MediaCallbackRatioRule' }
    MediaCallbackRatioRulePageEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data:
          type: object
          required: [records, total, size, current]
          properties:
            records: { type: array, items: { $ref: '#/components/schemas/MediaCallbackRatioRule' } }
            total: { type: integer, format: int64, minimum: 0 }
            size: { type: integer, format: int64, minimum: 1 }
            current: { type: integer, format: int64, minimum: 1 }
    DeductionSummaryRow:
      type: object
      required: [reportTime, linkRadio, callbackCount, deductionPassedCount, deductionDeductedCount, deductionPendingCount, basePrice]
      properties:
        reportTime: { type: string }
        mediaId: { type: string }
        mediaName: { type: string }
        monitorTaskId: { type: string }
        monitorName: { type: string }
        advertiserId: { type: string }
        advertiserName: { type: string }
        promotionLinkId: { type: string }
        promotionLinkName: { type: string }
        linkRadio: { type: [string, 'null'], description: 当前下游配置放行率的小数文本；未配置表示 Engine 默认 1.0 }
        callbackCount: { type: integer, format: int64, minimum: 0, description: SCX 收到的上游 Callback 数 }
        deductionPassedCount: { type: integer, format: int64, minimum: 0, description: 扣量放行并提交异步下游投递的 Callback 数，不表示媒体已经签收 }
        deductionDeductedCount: { type: integer, format: int64, minimum: 0, description: SCX 扣量拦截的 Callback 数 }
        deductionPendingCount: { type: integer, format: int64, minimum: 0, description: SCX 尚未完成扣量判定的 Callback 数 }
        basePrice: { type: number, minimum: 0, description: 广告主消费 }
    DeductionSummaryPage:
      type: object
      required: [records, current, size, total, deductionCoverageStart, deductionCoverageStatus]
      properties:
        records: { type: array, items: { $ref: '#/components/schemas/DeductionSummaryRow' } }
        current: { type: integer, format: int64, minimum: 1 }
        size: { type: integer, format: int64, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }
        deductionCoverageStart: { type: [string, 'null'], format: date-time }
        deductionCoverageStatus: { type: string, enum: [NONE, PARTIAL, FULL] }
    DeductionSummaryPageEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: '#/components/schemas/DeductionSummaryPage' }
    AdvertiserRolePermissionsUpdate:
      type: object
      additionalProperties: false
      required: [menuIds, allDataScope]
      properties:
        menuIds:
          type: array
          maxItems: 128
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        allDataScope:
          type: boolean
    AdvertiserRoleMenuNode:
      type: object
      required: [id, parentId, name, type, requiresAllDataScope, children]
      properties:
        id: { type: string }
        parentId: { type: string }
        name: { type: string }
        type: { type: string }
        permission: { type: [string, 'null'] }
        requiresAllDataScope: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/AdvertiserRoleMenuNode' }
    AdvertiserRolePermissions:
      type: object
      required: [roleId, roleName, roleCode, selectedMenuIds, allDataScope, affectedAccountCount, menuTree]
      properties:
        roleId: { type: string }
        roleName: { type: string }
        roleCode: { type: string, const: ROLE_ADVERTISER }
        selectedMenuIds:
          type: array
          items: { type: string }
        allDataScope: { type: boolean }
