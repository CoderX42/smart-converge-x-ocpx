    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}

# RTA 通用异步和 OPPO 同步入口，保留完整路径参与签名。部署时登记实际合作方/网关出口 CIDR。
location ~ "^/ocpx/rta/(requests|callbacks/[A-Za-z0-9_-]{1,64}|oppo/[A-Za-z0-9_-]{1,64})$" {
    allow 127.0.0.1/32;
    # allow <ACTUAL_PARTNER_OR_GATEWAY_CIDR>;
    deny all;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:10000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 7s;
    client_max_body_size 64k;
}

# 保留完整 /ocpx/open-api/... 路径，由 Engine 执行其现有认证和参数校验。
location ^~ /ocpx/open-api/ {
    proxy_pass http://127.0.0.1:10000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}

location /ocpx/ { return 404; }
location / { return 404; }


