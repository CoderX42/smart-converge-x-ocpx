# SCX 前端伪静态：粘贴到宝塔站点的“伪静态”配置。
# 站点根目录必须指向 /www/wwwroot/scx（或 SCX_WEB_ROOT），其中包含 index.html、css/、js/、jse/。

location ~* /actuator { return 403; }
location ^~ /config/ { return 404; }
location ^~ /logs/ { return 404; }
location ~ /\. { deny all; }
location ~* \.(htaccess|htpasswd|ini|log|sh|sql|php|py|bak|swp|env)$ { deny all; }

# /api/boot/... -> 127.0.0.1:9999/boot/...
location ^~ /api/ {
    proxy_pass http://127.0.0.1:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}

# 仅暴露 scx-ocpx-engine 的合作方接口；健康检查和管理端点不经公网站点转发。
# 保留完整 /ocpx/open-api/... 路径给 10000 端口应用做签名校验。
location ^~ /ocpx/open-api/ {
    proxy_pass http://127.0.0.1:10000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}

location ~* \.(?:js|mjs|css|map)$ { try_files $uri =404; }
location ~* \.(?:gif|jpg|jpeg|png|bmp|webp|ico|svg|woff|woff2|ttf|eot)$ { try_files $uri =404; }
location / { try_files $uri $uri/ /index.html; }
