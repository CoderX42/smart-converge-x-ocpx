# SCX 前端伪静态（宝塔 / 面板「伪静态」粘贴用）
#
# 使用前提：
#   1. 网站根目录必须是前端 dist 根（含 index.html、css/、js/、jse/、static/）
#      例如 /var/www/scx 或 /www/wwwroot/your-site
#   2. 不要用其它项目（如「浩荣商城」）的伪静态照搬
#   3. 前端 VITE_GLOB_API_URL=/api 且 VITE_OPEN_BOOT=true
#      浏览器请求 /api/boot/xxx，Nginx 只剥 /api → 后端 /boot/xxx
#
# 样式丢失常见原因：
#   - 网站根目录指错，/css/*.css 不存在
#   - SPA 的 try_files 把缺失的 .css 回退成 index.html
#     （Content-Type: text/html，浏览器当 CSS 解析失败 → 整站无样式）
#   - 只上传了 index.html，未同步完整 dist
#
# 自检：
#   curl -I https://你的域名/css/   # 或具体某个 css 文件，应 text/css 且 200
#   curl -I https://你的域名/jse/   # 入口 js 应 application/javascript

# ---------- 安全 ----------
location ~* /actuator {
    return 403;
}
location ^~ /config/ {
    return 404;
}
location ^~ /logs/ {
    return 404;
}
location ~ /\. {
    deny all;
}
location ~* \.(htaccess|htpasswd|ini|log|sh|sql|php|py|bak|swp|env)$ {
    deny all;
}

# ---------- API（保留前端拼好的 /boot，勿写成 proxy_pass .../boot/）----------
location ^~ /api/ {
    proxy_pass http://127.0.0.1:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}

# ---------- 后端 context-path 直出（Swagger / WS，可按需关掉）----------
location ^~ /boot/ws {
    proxy_pass http://127.0.0.1:9999/boot/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location ^~ /boot/ {
    location ~* ^/boot/actuator {
        return 403;
    }
    proxy_pass http://127.0.0.1:9999/boot/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}

# ---------- 静态资源（关键：找不到文件必须 404，禁止回退 index.html）----------
location ~* \.(?:js|mjs|css|map)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public, no-transform";
    try_files $uri =404;
}
location ~* \.(?:gif|jpg|jpeg|png|bmp|webp|ico|svg)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, no-transform";
    try_files $uri =404;
}
location ~* \.(?:woff|woff2|ttf|eot)$ {
    expires 365d;
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# ---------- SPA ----------
# 仅 HTML 路由回退；css/js 已被上面的正则 location 截获
location / {
    try_files $uri $uri/ /index.html;
}
