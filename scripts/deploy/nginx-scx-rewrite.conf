# 宝塔面板 / 站点「伪静态」或「自定义配置」粘贴用（只含 location / gzip 片段）
# 使用前请确认：
#   1. 网站根目录指向前端 dist：/var/www/scx 或站点 www 目录已同步 scx-fronted/apps/web-ele/dist
#   2. 后端已监听 127.0.0.1:9999，context-path=/boot
#   3. 不要使用 proxy_pass http://127.0.0.1:9999/;  必须带 /boot/

client_max_body_size 100m;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml;
gzip_disable "MSIE [1-6]\.";

# 敏感路径
location ~* /actuator {
    return 403;
}
location ^~ /config/ {
    return 404;
}
location ^~ /logs/ {
    return 404;
}
location ~ /\. {
    deny all;
}
location ~* \.(htaccess|htpasswd|ini|log|sh|sql|php|py|bak|swp|env)$ {
    deny all;
}

# 管理后台接口：/api/xxx -> 后端 /boot/xxx
# （前端 .env.production 中 VITE_GLOB_API_URL=/api）
location /api/ {
    proxy_pass http://127.0.0.1:9999/boot/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}

# WebSocket
location /boot/ws {
    proxy_pass http://127.0.0.1:9999/boot/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Swagger / 直接 /boot 业务（可不需要可删）
location /boot/ {
    location ~* ^/boot/actuator {
        return 403;
    }
    proxy_pass http://127.0.0.1:9999/boot/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}

# 前端静态资源缓存（本地文件）
location ~* \.(js|css)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public, no-transform";
    try_files $uri =404;
}
location ~* \.(gif|jpg|jpeg|png|bmp|webp|ico|svg)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, no-transform";
    try_files $uri =404;
}
location ~* \.(woff|woff2|ttf|eot)$ {
    expires 365d;
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# SPA
location / {
    try_files $uri $uri/ /index.html;
}
