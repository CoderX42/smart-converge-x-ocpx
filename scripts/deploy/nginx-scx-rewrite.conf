# 可选：仅 location 片段（一般不需要单独使用）
# 标准部署请直接使用完整站点文件 nginx-scx.conf → /etc/nginx/conf.d/scx.conf
#
# 路径约定与 nginx-scx.conf 相同：
#   前端 VITE_OPEN_BOOT=true → 浏览器请求 /api/boot/xxx
#   /api/boot/xxx → http://127.0.0.1:9999/boot/xxx

client_max_body_size 100m;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml;
gzip_disable "MSIE [1-6]\.";

location ~* /actuator {
    return 403;
}
location ^~ /config/ {
    return 404;
}
location ^~ /logs/ {
    return 404;
}
location ~ /\. {
    deny all;
}
location ~* \.(htaccess|htpasswd|ini|log|sh|sql|php|py|bak|swp|env)$ {
    deny all;
}

# 只剥 /api，保留前端已拼的 /boot（勿写成 .../boot/，否则会 /boot/boot/...）
location /api/ {
    proxy_pass http://127.0.0.1:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}

location /boot/ws {
    proxy_pass http://127.0.0.1:9999/boot/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /boot/ {
    location ~* ^/boot/actuator {
        return 403;
    }
    proxy_pass http://127.0.0.1:9999/boot/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}

# 静态资源禁止回退 index.html（否则 CSS Content-Type 变成 text/html → 样式丢失）
location ~* \.(?:js|mjs|css|map)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public, no-transform";
    try_files $uri =404;
}
location ~* \.(?:gif|jpg|jpeg|png|bmp|webp|ico|svg)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, no-transform";
    try_files $uri =404;
}
location ~* \.(?:woff|woff2|ttf|eot)$ {
    expires 365d;
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
