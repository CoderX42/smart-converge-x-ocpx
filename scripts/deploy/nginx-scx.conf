# SCX 生产 Nginx 站点配置
# 安装：cp scripts/deploy/nginx-scx.conf /etc/nginx/conf.d/scx.conf && nginx -t && systemctl reload nginx
#
# 浏览器访问：
#   前端静态：http://SERVER/
#   接口代理：/api/*  ->  http://127.0.0.1:9999/boot/*
#   健康检查（仅本机）：curl http://127.0.0.1:9999/boot/actuator/health

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_types text/plain text/xml text/css application/javascript application/json application/xml;
    gzip_vary on;

    root /var/www/scx;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 前端 SPA（hash 路由，静态回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端 VITE_GLOB_API_URL=/api
    # 将 /api/xxx 转发到后端 context-path /boot/xxx
    location /api/ {
        proxy_pass http://127.0.0.1:9999/boot/;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 禁止经公网代理暴露 actuator
    location ~* /actuator {
        return 403;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
