# SCX 生产 Nginx 完整站点配置（纯 Nginx，不依赖宝塔）
#
# 本机部署方式（root@42.81.102.181）：
#   cp /opt/smart-converge-x/scripts/deploy/nginx-scx.conf /etc/nginx/conf.d/scx.conf
#   # 若存在默认站点占用 80，先禁用：
#   #   rm -f /etc/nginx/sites-enabled/default
#   #   rm -f /etc/nginx/conf.d/default.conf
#   nginx -t && systemctl enable nginx && systemctl reload nginx
#
# 路径约定：
#   前端 VITE_GLOB_API_URL=/api ，产物目录 root=/var/www/scx
#   后端 context-path=/boot  port=9999（仅本机，勿对公网开放）
#   浏览器 /api/xxx  →  127.0.0.1:9999/boot/xxx
#   浏览器 /        →  静态 SPA

server {
    listen 80;
    # 有域名时改成真实域名，例如 api.example.com 或 admin.example.com
    server_name _;

    root /var/www/scx;
    index index.html;

    client_max_body_size 100m;

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---------- Gzip ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ---------- 禁止敏感路径 ----------
    location ~* /actuator {
        return 403;
    }
    location ^~ /config/ {
        return 404;
    }
    location ^~ /logs/ {
        return 404;
    }
    location ~ /\. {
        deny all;
    }
    location ~* \.(htaccess|htpasswd|ini|log|sh|sql|php|py|bak|swp|env)$ {
        deny all;
    }

    # ---------- 管理后台 API（前端 /api/*）----------
    # 关键：必须转到 /boot/，不能 proxy_pass 到 http://127.0.0.1:9999/ （会丢掉 context-path）
    location /api/ {
        proxy_pass http://127.0.0.1:9999/boot/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # ---------- WebSocket ----------
    location /boot/ws {
        proxy_pass http://127.0.0.1:9999/boot/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 直接访问 /boot/*（Swagger、运维调试）----------
    # 生产若不想暴露 knife4j，可整段注释掉，只保留 /api/
    location /boot/ {
        # 再次挡住经 /boot 暴露的 actuator
        location ~* ^/boot/actuator {
            return 403;
        }
        proxy_pass http://127.0.0.1:9999/boot/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # ---------- 前端构建产物静态缓存（磁盘文件，不要反代到 Java）----------
    location ~* \.(js|css)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
    location ~* \.(gif|jpg|jpeg|png|bmp|webp|ico|svg)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA（hash 路由；无文件时回 index.html）----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
