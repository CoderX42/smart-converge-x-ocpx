spring:
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      password: ${REDIS_PASSWORD:}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

  # 数据库相关配置
  datasource:
    dynamic:
      primary: master   # 指定默认数据源
      datasource:
        master:         # 注意，这里要嵌套在 datasource 下
          url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/smart_converge_x?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&allowPublicKeyRetrieval=true}
          username: ${MYSQL_USERNAME:root}
          password: ${MYSQL_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: dev_producer_group
    retry-times-when-send-failed: 5
    send-message-timeout: 5000

aj:
  captcha:
    cache-type: redis
    water-mark: boot

encode:
  key: VyBcekSelErhMYN4

xxl:
  job:
    adminAddresses: http://localhost:8080
    accessToken: yssadadasdasdasda

cert-dir: C:\Download

#knife4j配置
knife4j:
  #是否启用增强设置
  enable: false
  #开启生产环境屏蔽
  production: false
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn
