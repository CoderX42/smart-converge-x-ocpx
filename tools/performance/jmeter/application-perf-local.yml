server:
  port: 19999

spring:
  config:
    fail-on-unresolved-placeholders: false
  data:
    redis:
      host: 127.0.0.1
      port: 16389
      database: 0
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:13316/smart_converge_x?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FShanghai&rewriteBatchedStatements=true
          username: root
          password: local-jmeter-root-only
          driver-class-name: com.mysql.cj.jdbc.Driver

scx:
  ocpx:
    public-base-url: http://127.0.0.1:19999/ocpx
    partition-count: 64
    batch-size: 500
    debug-execution-enabled: false
    poll-delay-ms: 10
    idempotency-ttl: 7d
    nonce-ttl: 5m
    snapshot-ttl: 7d
    callback-token-ttl: 7d
    pending-idle: 10s
    max-delivery-attempts: 5
    replica-acks-required: 1
    replica-ack-timeout-ms: 100
    device-hmac-key-version: 1
    allow-http: true
    allow-private-addresses: true
    upstream-delivery-enabled: false
    downstream-delivery-enabled: false
    adapter-concurrency: 128
    circuit-failure-threshold: 1000
    circuit-open-duration: 5s
    per-channel-qps: 30000

