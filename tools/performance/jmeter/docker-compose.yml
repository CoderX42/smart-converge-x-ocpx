services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=600
      - --innodb-buffer-pool-size=1073741824
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
    environment:
      MYSQL_ROOT_PASSWORD: local-jmeter-root-only
      MYSQL_DATABASE: smart_converge_x
    ports:
      - 127.0.0.1:13316:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -uroot -plocal-jmeter-root-only --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis-primary:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - 127.0.0.1:16389:6379
    volumes:
      - redis-primary-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-replica:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --replicaof
      - redis-primary
      - "6379"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    depends_on:
      redis-primary:
        condition: service_healthy
    ports:
      - 127.0.0.1:16390:6379
    volumes:
      - redis-replica-data:/data
    healthcheck:
      test: [CMD-SHELL, "test \"$$(redis-cli INFO replication | tr -d '\\r' | sed -n 's/^master_link_status://p')\" = up"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  mysql-data:
  redis-primary-data:
  redis-replica-data:

