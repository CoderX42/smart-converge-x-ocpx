seata:
  # 开发环境默认不启用；需要时通过固定配置改为 true 并部署 Seata Server。
  enabled: false
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    file:
      name: file.conf
    type: file
  config:
    file:
      name: file.conf
    type: file
