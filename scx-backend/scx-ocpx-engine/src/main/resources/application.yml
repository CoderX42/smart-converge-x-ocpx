server:
  port: 10000
  servlet:
    context-path: /ocpx

spring:
  application:
    name: scx-ocpx-engine
  profiles:
    active: dev
  config:
    fail-on-unresolved-placeholders: false
  main:
    web-application-type: servlet

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

bid:
  job:
    thread: 1

app:
  http:
    timeout-millis: 3000
  jobs:
    storage-cron: '0 0/1 * * * ?'
    reset-enabled: true
