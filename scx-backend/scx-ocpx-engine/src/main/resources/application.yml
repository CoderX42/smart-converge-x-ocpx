server:
  port: 10000

spring:
  application:
    name: scx-ocpx-engine
  profiles:
    active: dev
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: false
  webflux:
    # This public context path participates in the HMAC signature input.
    base-path: /ocpx

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.yzytech.scx.ocpx: INFO

scx:
  ocpx:
    public-base-url: http://127.0.0.1:10000/ocpx
    partition-count: 64
    batch-size: 500
    debug-execution-enabled: true
    poll-delay-ms: 20
    idempotency-ttl: 7d
    nonce-ttl: 5m
    snapshot-ttl: 7d
    callback-token-ttl: 7d
    pending-idle: 30s
    max-delivery-attempts: 5
    replica-acks-required: 0
    replica-ack-timeout-ms: 20
    device-hmac-key: replace-before-production-device-hmac-key
    payload-aes-key: replace-before-production-payload-aes-key
    callback-token-key: replace-before-production-callback-token-key
    allow-http: true
    allow-private-addresses: true
    upstream-delivery-enabled: false
    downstream-delivery-enabled: false
    adapter-concurrency: 64
    circuit-failure-threshold: 20
    circuit-open-duration: 30s
    per-channel-qps: 30000
