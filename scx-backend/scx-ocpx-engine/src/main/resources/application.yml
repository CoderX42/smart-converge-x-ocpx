server:
  port: 10000
  servlet:
    context-path: /ocpx

spring:
  application:
    name: scx-ocpx-engine
  profiles:
    active: dev
  config:
    fail-on-unresolved-placeholders: false
  main:
    web-application-type: servlet

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

bid:
  job:
    thread: 1

ocpx:
  compatibility-report:
    enabled: false
  flow-log:
    success-sample-rate: 0.1
  delivery:
    upstream:
      core-threads: 32
      max-threads: 64
      queue-capacity: 200
    downstream:
      core-threads: 32
      max-threads: 64
      queue-capacity: 200

app:
  rta-relay:
    enabled: false
    public-base-url: https://example.invalid/ocpx
    callback-base-url: https://example.invalid/ocpx
    allowed-hosts: rta.example.invalid
    credentials: {}
    payload-key: ''
  http:
    timeout-millis: 3000
  jobs:
    storage-cron: '0 0/1 * * * ?'
    storage-batch-size: 500
    storage-max-retries: 3
    storage-retry-backoff-ms: 1000
    storage-max-batches-per-run: 20
    storage-max-run-ms: 30000
    storage-batch-pause-ms: 100
    retention-cron: '0 0/10 * * * ?'
    retention-batch-size: 1000
    retention-max-batches-per-target: 2
    retention-batch-pause-ms: 100
    feedback-day-retention-cron: '0 5/10 * * * ?'
    feedback-day-retention-batch-size: 1000
    feedback-day-retention-max-batches: 2
    feedback-day-retention-batch-pause-ms: 100
    reset-enabled: true
