spring:
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB
  cache:
    type: redis
  data:
    redis:
      host: ${SCX_REDIS_HOST}
      port: ${SCX_REDIS_PORT:6379}
      username: ${SCX_REDIS_USERNAME:}
      password: ${SCX_REDIS_PASSWORD}
      database: ${SCX_REDIS_DATABASE:0}
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: ${SCX_DATASOURCE_URL}
          username: ${SCX_DATASOURCE_USERNAME}
          password: ${SCX_DATASOURCE_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${SCX_ROCKETMQ_PRODUCER_GROUP:dev_producer_group}
    retry-times-when-send-failed: 5
    send-message-timeout: 5000

aj:
  captcha:
    cache-type: redis
    water-mark: boot

xxl:
  job:
    adminAddresses: ${SCX_XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8080}
    accessToken: ${SCX_XXL_JOB_ACCESS_TOKEN:}

cert-dir: ${SCX_CERT_DIR:./cert}

encode:
  key: ${SCX_ENCODE_KEY}

knife4j:
  enable: false
  production: false
  basic:
    enable: false
  setting:
    language: zh_cn

scx:
  tracking:
    sandbox-enabled: true
    sandbox-signing-key: ${SCX_SANDBOX_SIGNING_KEY:}
    ingress-enabled: ${SCX_TRACKING_INGRESS_ENABLED:false}
    feedback-store: ${SCX_TRACKING_FEEDBACK_STORE:memory}
    worker-enabled: ${SCX_TRACKING_WORKER_ENABLED:true}
    outbox-publisher-enabled: ${SCX_TRACKING_OUTBOX_PUBLISHER_ENABLED:false}
    channel-master-key: ${SCX_TRACKING_CHANNEL_MASTER_KEY:}
    device-hmac-key: ${SCX_TRACKING_DEVICE_HMAC_KEY:}
    callback-sandbox-endpoint: ${SCX_TRACKING_CALLBACK_SANDBOX_ENDPOINT:http://127.0.0.1:18080/postback}
    callback-allowed-hosts: ${SCX_TRACKING_CALLBACK_ALLOWED_HOSTS:127.0.0.1,localhost}
    attribution-rule-version: ${SCX_TRACKING_ATTRIBUTION_RULE_VERSION:last-click-v1}
