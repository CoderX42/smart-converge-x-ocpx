spring:
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      host: ${SCX_REDIS_HOST}
      username: ${SCX_REDIS_USERNAME}
      password: ${SCX_REDIS_PASSWORD}
      port: ${SCX_REDIS_PORT:6379}
      database: ${SCX_REDIS_DATABASE:2}

  # 数据库相关配置
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: ${SCX_DATASOURCE_URL}
          username: ${SCX_DATASOURCE_USERNAME}
          password: ${SCX_DATASOURCE_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource

rocketmq:
  name-server: 127.0.0.1
  producer:
    group: dev_producer_group
    retry-times-when-send-failed: 5
    send-message-timeout: 5000

aj:
  captcha:
    cache-type: redis
    water-mark: boot

xxl:
  job:
    adminAddresses: http://localhost:8080
    accessToken: yssadadasdasdasda

cert-dir: C:\Download

encode:
  key: yzytech2026yzytech

#knife4j配置
knife4j:
  #是否启用增强设置
  enable: false
  #开启生产环境屏蔽
  production: false
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn

scx:
  tracking:
    sandbox-enabled: true
    sandbox-signing-key: scx-sandbox-local-only
    ingress-enabled: ${SCX_OCPX_INGRESS_ENABLED:false}
    feedback-store: ${SCX_FEEDBACK_STORE:memory}
    channel-master-key: ${SCX_CHANNEL_MASTER_KEY:}
    device-hmac-key: ${SCX_DEVICE_HMAC_KEY:}
    attribution-rule-version: last-click-v1
