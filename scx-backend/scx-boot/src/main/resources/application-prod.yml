spring:
  config:
    fail-on-unresolved-placeholders: true
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB
  cache:
    type: redis
  data:
    redis:
      host: ${SCX_REDIS_HOST}
      port: ${SCX_REDIS_PORT:6379}
      username: ${SCX_REDIS_USERNAME:}
      password: ${SCX_REDIS_PASSWORD}
      database: ${SCX_REDIS_DATABASE:0}
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: ${SCX_DATASOURCE_URL}
          username: ${SCX_DATASOURCE_USERNAME}
          password: ${SCX_DATASOURCE_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}
  producer:
    group: ${SCX_ROCKETMQ_PRODUCER_GROUP:producer_group}
    retry-times-when-send-failed: 5
    send-message-timeout: 5000

aj:
  captcha:
    cache-type: redis
    water-mark: boot

xxl:
  job:
    adminAddresses: ${SCX_XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8080}
    accessToken: ${SCX_XXL_JOB_ACCESS_TOKEN}
    appName: smart-converge-x
    port: ${SCX_XXL_JOB_EXECUTOR_PORT:9009}

cert-dir: ${SCX_CERT_DIR:./cert}

encode:
  key: ${SCX_ENCODE_KEY}

knife4j:
  enable: true
  production: true
  basic:
    enable: false
  setting:
    language: zh_cn

scx:
  tracking:
    sandbox-enabled: false
    attribution-rule-version: ${SCX_TRACKING_ATTRIBUTION_RULE_VERSION:last-click-v1}
    feedback-store: redis
    ingress-enabled: true
    worker-enabled: true
    outbox-publisher-enabled: ${SCX_TRACKING_OUTBOX_PUBLISHER_ENABLED:true}
    channel-master-key: ${SCX_TRACKING_CHANNEL_MASTER_KEY}
    device-hmac-key: ${SCX_TRACKING_DEVICE_HMAC_KEY}
    callback-sandbox-endpoint: ${SCX_TRACKING_CALLBACK_SANDBOX_ENDPOINT:}
    callback-allowed-hosts: ${SCX_TRACKING_CALLBACK_ALLOWED_HOSTS:}
