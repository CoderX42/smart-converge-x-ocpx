scx:
  ocpx:
    public-base-url: https://ocpx.zhongsenyuedong.cn/ocpx
    admin:
      tracking:
        engine-base-url: https://ocpx.zhongsenyuedong.cn/ocpx
    partner-credentials:
      advertisers: {}
      media: {}

# =============================================================================
# 生产配置：直接写在本文件，不依赖环境变量 /etc/scx/scx.env
#
# 部署机修改后重新打包即可生效：
#   nano /opt/smart-converge-x/scx-backend/scx-boot/src/main/resources/application-prod.yml
#   bash /opt/smart-converge-x/scripts/bt-deploy/01-deploy.sh --no-pull backend
#
# 注意：密码等会打进 jar，请控制仓库与服务器访问权限。
# =============================================================================

spring:
  config:
    fail-on-unresolved-placeholders: false
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      host: redis-cnlfagupdyxgrkgqd.redis.ivolces.com
      port: 6379
      username: ocpxuser
      password: OqS5ZRBU1wBuEqLeHAQ3
      database: 0

  # 数据库相关配置
  datasource:
    dynamic:
      primary: master   # 指定默认数据源
      datasource:
        master:         # 注意，这里要嵌套在 datasource 下
          url: jdbc:mysql://mysqle379be1ffea9.rds.ivolces.com:3306/smart_converge_x?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia%2FShanghai&allowPublicKeyRetrieval=true
          username: ocpxuser
          password: OqS5ZRBU1wBuEqLeHAQ3
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: producer_group
    retry-times-when-send-failed: 5
    send-message-timeout: 5000

aj:
  captcha:
    cache-type: redis
    water-mark: boot

xxl:
  job:
    adminAddresses: http://127.0.0.1:8080
    accessToken: scx-prod-xxl-token
    appName: smart-converge-x
    port: 9009

cert-dir: ./cert

encode:
  key: scx-dev-encode-key

#knife4j配置
knife4j:
  #是否启用增强设置
  enable: true
  #开启生产环境屏蔽
  production: true
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn

logging:
  level:
    # RocketMQTemplate includes the complete message object in send-failure
    # logs. Outbox state already records a controlled error code/message.
    org.apache.rocketmq.spring.core.RocketMQTemplate: OFF
