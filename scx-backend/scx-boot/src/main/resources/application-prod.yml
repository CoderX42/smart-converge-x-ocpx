spring:
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      host: ${SCX_REDIS_HOST}
      username: ${SCX_REDIS_USERNAME}
      password: ${SCX_REDIS_PASSWORD}
      port: ${SCX_REDIS_PORT:6379}
      database: ${SCX_REDIS_DATABASE:0}

  # 数据库相关配置
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: ${SCX_DATASOURCE_URL}
          username: ${SCX_DATASOURCE_USERNAME}
          password: ${SCX_DATASOURCE_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: producer_group
    retry-times-when-send-failed: 5
    send-message-timeout: 5000

aj:
  captcha:
    cache-type: redis
    water-mark: boot

xxl:
  job:
    adminAddresses: http://127.0.0.1:8080
    accessToken: ${SCX_XXL_JOB_ACCESS_TOKEN}

cert-dir: ./cert

encode:
  key: ${SCX_ENCODE_KEY}

#knife4j配置
knife4j:
  #是否启用增强设置
  enable: true
  #开启生产环境屏蔽
  production: true
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn

scx:
  tracking:
    sandbox-enabled: false
    attribution-rule-version: last-click-v1
    feedback-store: redis
    ingress-enabled: ${SCX_OCPX_INGRESS_ENABLED:true}
    worker-enabled: ${SCX_OCPX_WORKER_ENABLED:true}
    channel-master-key: ${SCX_CHANNEL_MASTER_KEY}
    device-hmac-key: ${SCX_DEVICE_HMAC_KEY}
