spring:
  data:
    redis:
      host: 127.0.0.1
      password: scx_local_only
      port: 6379
      database: 0
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/smart_converge_x?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia%2FShanghai&allowPublicKeyRetrieval=true
          username: root
          password: scx_local_only
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: scx_local_producer
    retry-times-when-send-failed: 3
    send-message-timeout: 5000

xxl:
  job:
    adminAddresses: http://127.0.0.1:8080
    accessToken: scx_local_only

encode:
  # Matches apps/web-ele/.env so the local UI preserves the existing AES login contract.
  key: yzytech2026yzytech

scx:
  tracking:
    sandbox-enabled: true
    sandbox-signing-key: scx-local-only-signing-key
    ingress-enabled: ${SCX_OCPX_INGRESS_ENABLED:false}
    feedback-store: ${SCX_FEEDBACK_STORE:memory}
    channel-master-key: ${SCX_CHANNEL_MASTER_KEY:}
    device-hmac-key: ${SCX_DEVICE_HMAC_KEY:}
    callback-sandbox-endpoint: http://127.0.0.1:8089/callback
    callback-allowed-hosts:
      - localhost
      - 127.0.0.1
      - callback-mock
    outbox-publisher-enabled: true
    outbox-topic: scx_tracking_events
