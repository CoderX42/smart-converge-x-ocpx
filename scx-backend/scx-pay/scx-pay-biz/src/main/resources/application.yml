server:
  port: 6900

spring:
  application:
    name: @artifactId@
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: boot-pro-nacos:8848
      config:
        server-addr: 127.0.0.1:8848
  config:
    import:
      - optional:nacos:application-@profiles.active@.yml
      - optional:nacos:scx-boot-dev.yml

