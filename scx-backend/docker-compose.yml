services:
  smart-converge-x-mysql:
    image: mysql:8.0
    container_name: smart-converge-x-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: scx_local_only
      MYSQL_DATABASE: smart_converge_x
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/smart-converge-x/00schema.sql:/docker-entrypoint-initdb.d/00schema.sql:ro
      - ./db/smart-converge-x/10smart_converge_x_core.sql:/docker-entrypoint-initdb.d/10smart_converge_x_core.sql:ro
      - ./db/smart-converge-x/20xxl_job_schema.sql:/docker-entrypoint-initdb.d/20xxl_job_schema.sql:ro
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower-case-table-names=1
      --max-connections=1024
    networks:
      - smart-converge-x-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  smart-converge-x-redis:
    image: redis:7-alpine
    container_name: smart-converge-x-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass scx_local_only
    networks:
      - smart-converge-x-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDISCLI_AUTH\" ping"]
    environment:
      REDISCLI_AUTH: scx_local_only
      interval: 10s
      timeout: 5s
      retries: 5

  smart-converge-x-rocketmq-namesrv:
    image: apache/rocketmq:5.4.0
    container_name: smart-converge-x-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    command: sh mqnamesrv
    networks:
      - smart-converge-x-net

  smart-converge-x-rocketmq-broker:
    image: apache/rocketmq:5.4.0
    container_name: smart-converge-x-rocketmq-broker
    restart: always
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: smart-converge-x-rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    command: sh mqbroker -n smart-converge-x-rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.4.0/conf/broker.conf
    networks:
      - smart-converge-x-net
    depends_on:
      - smart-converge-x-rocketmq-namesrv

  smart-converge-x-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: smart-converge-x-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scx-local
      MINIO_ROOT_PASSWORD: scx-local-only-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - smart-converge-x-net

  smart-converge-x-callback-mock:
    image: wiremock/wiremock:3.13.1
    container_name: smart-converge-x-callback-mock
    restart: unless-stopped
    ports:
      - "8089:8080"
    networks:
      - smart-converge-x-net

networks:
  smart-converge-x-net:
    name: smart-converge-x-net
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
