    public-base-url: https://ocpx.example.com/rtb
    replica-acks-required: 1
    allow-http: false
    allow-private-addresses: false
    upstream-delivery-enabled: false
    downstream-delivery-enabled: false
    device-hmac-key: replace-before-production-device-hmac-key
    payload-aes-key: replace-before-production-payload-aes-key
    callback-token-key: replace-before-production-callback-token-key
