services:
  smart-converge-x-mysql:
    image: mysql:8.0
    container_name: smart-converge-x-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: smart_converge_x
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/smart-converge-x/00schema.sql:/docker-entrypoint-initdb.d/00schema.sql:ro
      - ./db/smart-converge-x/10smart_converge_x_core.sql:/docker-entrypoint-initdb.d/10smart_converge_x_core.sql:ro
      - ./db/smart-converge-x/20xxl_job_schema.sql:/docker-entrypoint-initdb.d/20xxl_job_schema.sql:ro
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower-case-table-names=1
      --max-connections=1024
    networks:
      - smart-converge-x-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  smart-converge-x-redis:
    image: redis:7-alpine
    container_name: smart-converge-x-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass redis
    networks:
      - smart-converge-x-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  smart-converge-x-rocketmq-namesrv:
    image: apache/rocketmq:5.4.0
    container_name: smart-converge-x-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    command: sh mqnamesrv
    networks:
      - smart-converge-x-net

  smart-converge-x-rocketmq-broker:
    image: apache/rocketmq:5.4.0
    container_name: smart-converge-x-rocketmq-broker
    restart: always
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: smart-converge-x-rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    command: sh mqbroker -n smart-converge-x-rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.4.0/conf/broker.conf
    networks:
      - smart-converge-x-net
    depends_on:
      - smart-converge-x-rocketmq-namesrv

  scx-boot:
    build:
      context: ./scx-boot
      dockerfile: Dockerfile
    pull_policy: never
    container_name: scx-boot
    restart: always
    ports:
      - "9999:9999"
    environment:
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://smart-converge-x-mysql:3306/smart_converge_x?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowMultiQueries=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: smart-converge-x-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis
      ROCKETMQ_NAME_SERVER: smart-converge-x-rocketmq-namesrv:9876
    networks:
      - smart-converge-x-net
    depends_on:
      smart-converge-x-mysql:
        condition: service_healthy
      smart-converge-x-redis:
        condition: service_healthy
      smart-converge-x-rocketmq-broker:
        condition: service_started

networks:
  smart-converge-x-net:
    name: smart-converge-x-net
    driver: bridge

volumes:
  mysql-data:
  redis-data:
