# Local Docker Desktop broker configuration.
# The application runs on the host and reaches the broker through the published
# 10911 port, so advertise the same loopback address returned by the name server.
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerIP1=127.0.0.1
listenPort=10911
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
