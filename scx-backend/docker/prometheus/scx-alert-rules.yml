groups:
  - name: scx-queue-health
    rules:
      - alert: ScxOutboxDeadLetters
        expr: scx_outbox_queue{state="dead"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: SCX Outbox has dead-letter records
          runbook: docs/广告平台设计/runbooks/M6-可观测性与故障演练.md#outbox-or-dlq
      - alert: ScxCallbackDeadLetters
        expr: scx_callback_queue{state="dead"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: SCX callback queue has dead-letter records
          runbook: docs/广告平台设计/runbooks/M6-可观测性与故障演练.md#outbox-or-dlq
      - alert: ScxOutboxBacklogHigh
        expr: sum(scx_outbox_queue{state=~"pending|retrying|delayed"}) > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: SCX Outbox backlog exceeds the MVP operating threshold
          runbook: docs/广告平台设计/runbooks/M6-可观测性与故障演练.md#backlog
      - alert: ScxCallbackBacklogHigh
        expr: sum(scx_callback_queue{state=~"pending|retrying|delayed"}) > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: SCX callback backlog exceeds the MVP operating threshold
          runbook: docs/广告平台设计/runbooks/M6-可观测性与故障演练.md#backlog
