# Only for a locally started scx-boot process. Compose deployments use
# prometheus.yml, where scx-boot is resolved through the Compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/scx-alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - smart-converge-x-alertmanager:9093

scrape_configs:
  - job_name: scx-boot-host-local
    metrics_path: /boot/actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:10099
