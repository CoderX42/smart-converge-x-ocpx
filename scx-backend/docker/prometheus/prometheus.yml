global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/scx-alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - smart-converge-x-alertmanager:9093

scrape_configs:
  - job_name: scx-boot
    metrics_path: /boot/actuator/prometheus
    static_configs:
      - targets:
          - scx-boot:9999
